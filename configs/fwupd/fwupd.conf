# managed by arch-dotfiles/fwupd, see man 5 fwupd.conf
[fwupd]
# passimd would serve the metadata to the lan, every machine fetches from lvfs itself
P2pPolicy=nothing

[uefi_capsule]
# no shim: secure boot runs on sbctl's own keys, so link.sh signs fwupdx64.efi with them
DisableShimForSecureBoot=true
