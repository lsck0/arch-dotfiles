# Generated from the wallpaper by wallust. Sourced by configs/tmux/tmux.conf.
#
# tmux has no pywal integration of its own. Writing a pywal-style placeholder
# straight into a tmux option does not work either: that syntax collides with
# tmux's own FORMAT syntax, and no such format variable exists, so the style
# silently renders with no colour. Real hex has to be written into a file
# tmux can source, which is what this template produces.
#
# NOTE: wallust templates the WHOLE file, comments included, so never write a
# placeholder-looking token in prose here.
set -g @wal_background "{background}"
set -g @wal_foreground "{foreground}"
set -g @wal_color1 "{color1}"
set -g @wal_color2 "{color2}"
set -g @wal_color4 "{color4}"

set -g popup-style "bg={background}"
set -g popup-border-style "fg={color1}"
set -g status-style "bg={background},fg={foreground}"
set -g pane-active-border-style "bg=default,fg={color4}"
set -g pane-border-style "fg={color1}"
set -g message-style "bg={background},fg={foreground}"
set -g mode-style "bg={color4},fg={background}"
