set -g @wal_background "{background}"
set -g @wal_foreground "{foreground}"
set -g @wal_color1 "{color1}"
set -g @wal_color2 "{color2}"
set -g @wal_color4 "{color4}"

set -g popup-style "bg={background}"
set -g popup-border-style "fg={color1}"
# Transparent status line: no bg on any status-* component, so it shows the
# terminal's own (ghostty background-opacity-driven) background instead of a
# solid wal color -- matches lualine's transparent.nvim treatment in nvim.
set -g status-style "bg=default,fg={foreground}"
set -g status-left-style "bg=default,fg={foreground}"
set -g status-right-style "bg=default,fg={foreground}"
set -g window-status-style "bg=default,fg={foreground}"
set -g window-status-current-style "bg=default,fg={color4}"
set -g window-status-activity-style "bg=default,fg={color1}"
set -g pane-active-border-style "bg=default,fg={color4}"
set -g pane-border-style "fg={color1}"
set -g message-style "bg=default,fg={foreground}"
set -g mode-style "bg={color4},fg={background}"
