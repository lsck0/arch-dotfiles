# app -> media.role for pulse clients; chains.sh claims roles, apps without a claimed role stay direct
# spotify is a native client and tags itself Music; later rules win, so a webview chat app lands in voice
pulse.rules = [
    {
        matches = [
            { application.name = "Firefox" }
            { application.name = "Chromium" }
        ]
        actions = { update-props = { media.role = "Movie" } }
    }
    {
        matches = [
            { application.process.binary = "Discord" }
            { application.name = "ZapZap" }
        ]
        actions = { update-props = { media.role = "Communication" } }
    }
]
