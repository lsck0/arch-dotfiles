[main]
rc-manager=resolvconf

[device]
wifi.scan-rand-mac-address=yes

[connection]
# a fresh random mac on every connect; home keeps the hardware mac (home-wired.conf, system.sh) so router reservations hold
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# never leak the real hostname in dhcp; reservations are mac-based
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# the dhcpv6 duid follows the random mac, not the permanent machine-id
ipv6.dhcp-duid=ll

# keep the check (auto-vpn waits on full), but not one that announces arch on every network
[connectivity]
uri=http://connectivitycheck.gstatic.com/generate_204
response=
