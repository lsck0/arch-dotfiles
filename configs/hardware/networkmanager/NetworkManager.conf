[main]
rc-manager=resolvconf

[device]
wifi.scan-rand-mac-address=yes

[connection]
# a fresh random mac on every connect; home keeps the hardware mac (home-wired.conf, link.sh) so router reservations hold
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# never leak the real hostname in dhcp; reservations are mac-based, untrusted gets idspoof's persona hostname
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
