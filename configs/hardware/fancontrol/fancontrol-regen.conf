[Unit]
# fancontrol-gen.service (unsandboxed oneshot) rebuilds /etc/fancontrol for the live hwmon numbering first; fancontrol itself keeps ProtectSystem=full and only reads the config
Requires=fancontrol-gen.service
After=fancontrol-gen.service
# five tries cover the resume window, a really broken it87 still ends in failed
StartLimitIntervalSec=1min
StartLimitBurst=5

[Service]
# it87 answers EBUSY for a moment after an s3 resume, and fancontrol then aborts with every fan at full speed
Restart=on-failure
RestartSec=5s
