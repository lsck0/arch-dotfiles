# >100: swapping to zram is cheaper than dropping page cache
vm.swappiness = 150

# dentry/inode cache cannot go to zram
vm.vfs_cache_pressure = 50

# no swap readahead
vm.page-cluster = 0

# avoid reclaim bursts from fragmentation
vm.watermark_boost_factor = 0

# let kswapd reclaim early instead of direct reclaim stalls
vm.watermark_scale_factor = 125

# cap dirty pages at 64M/256M to avoid writeback stalls
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

vm.dirty_writeback_centisecs = 1500
