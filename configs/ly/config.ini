# ly display manager - cyberpunk/matrix rice.
# TTY app: 8-color ANSI mode for reliable colors on any console.
# Color format is 0xSSRRGGBB; with full_color off the low byte is the
# ANSI code (CYAN 0x07, GREEN 0x03, RED 0x02, WHITE 0x08, DEFAULT 0x00)
# and the high byte is styling (BOLD 0x01). Only changed keys are set;
# ly uses its built-in defaults for everything else.

# Eight-color ANSI mode: predictable on a real TTY, authentic matrix look
full_color = false

# Matrix rain animation - matches this desktop's hacker theme
animation = matrix

# Classic green rain with bright white leading heads
cmatrix_fg = 0x00000003
cmatrix_head_col = 0x01000008

# Bright cyan accent for text and the box border
fg = 0x01000007
border_fg = 0x01000007

# Terminal default (black) background for box and screen
bg = 0x00000000

# Bold red errors on default background
error_fg = 0x01000002
error_bg = 0x00000000

# Solid box backdrop so login text stays readable over the rain
blank_box = true

# Keep the accent border, drop the power hints for a clean look (keys still work)
hide_borders = false
hide_key_hints = true

# Cyberpunk box title
box_title = [ ACCESS ]

# Clock in the top right corner
clock = %H:%M:%S

# Password mask character
asterisk = *

# Erase password input after a failed attempt
clear_password = true

# Start on the login field and remember last user/session
default_input = login
save = true

# Sensible box margins
margin_box_h = 2
margin_box_v = 1
