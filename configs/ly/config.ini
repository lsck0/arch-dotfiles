# ly display manager - cyberpunk/matrix rice.
# Full-color mode so the exact palette matches grub, plymouth and the desktop
# matrix lockscreen (bg #0B0E14, accent #39BAE6, head #59C2FF). Format 0xSSRRGGBB,
# SS is styling (BOLD 0x01). Only changed keys are set.
full_color = true

# Matrix rain animation - matches this desktop's hacker theme
animation = matrix

# Cyan rain with bright cyan heads, matching the desktop lockscreen (not green)
cmatrix_fg = 0x001C6E8C
cmatrix_head_col = 0x0059C2FF

# Accent #39BAE6 for text and the box border, same as grub/plymouth
fg = 0x0039BAE6
border_fg = 0x0039BAE6

# Near-black background #0B0E14, same as grub/plymouth
bg = 0x000B0E14

# Theme red errors on the same background
error_fg = 0x00F07178
error_bg = 0x000B0E14

# Solid box backdrop so login text stays readable over the rain
blank_box = true

# Keep the accent border, drop the power hints for a clean look (keys still work)
hide_borders = false
hide_key_hints = true

# Cyberpunk box title
box_title = [ ACCESS ]

# Clock in the top right corner
clock = %H:%M:%S

# Password mask character
asterisk = *

# Erase password input after a failed attempt
clear_password = true

# Start on the login field and remember last user/session
default_input = login
save = true

# Sensible box margins
margin_box_h = 2
margin_box_v = 1
