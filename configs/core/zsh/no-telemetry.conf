# telemetry opt-outs for the whole session: systemd's user manager reads this for every unit, so uwsm/plasma apps
# get it too, and zshrc sources it for tty and ssh logins. KEY=value only, no quoting: both read it.
# DISABLE_TELEMETRY and CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC are left out, claude's remote control needs the
# feature flags they switch off; claude's own opt-outs are in configs/programming/claude/link.sh
DO_NOT_TRACK=1
GH_TELEMETRY=0
DOTNET_CLI_TELEMETRY_OPTOUT=1
POWERSHELL_TELEMETRY_OPTOUT=1
AZURE_CORE_COLLECT_TELEMETRY=0
FUNCTIONS_CORE_TOOLS_TELEMETRY_OPTOUT=1
NEXT_TELEMETRY_DISABLED=1
NUXT_TELEMETRY_DISABLED=1
ASTRO_TELEMETRY_DISABLED=1
GATSBY_TELEMETRY_DISABLED=1
STORYBOOK_DISABLE_TELEMETRY=1
TURBO_TELEMETRY_DISABLED=1
YARN_ENABLE_TELEMETRY=0
SCARF_ANALYTICS=false
HOMEBREW_NO_ANALYTICS=1
CHECKPOINT_DISABLE=1
HF_HUB_DISABLE_TELEMETRY=1
VCPKG_DISABLE_METRICS=1
