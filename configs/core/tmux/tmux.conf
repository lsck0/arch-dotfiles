set-option -g default-shell /bin/zsh
set -s terminal-overrides[10] ',*:Smulx=\E[4::%p1%dm'
set -s terminal-overrides[11] ',*:Setulc=\E[58::2::%p1%{6}%*%d:%p2%{256}%*%{65536}%/%d:%p3%{256}%*%{256}%/%d:%p4%d;7m'
set -gq allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -s extended-keys on
set -s terminal-features[10] 'xterm*:RGB:extkeys'

set -g @fingers-key o
set -g @fingers-jump-key O
set -g @fingers-skip-wizard 1

unbind-key C-b
set-option -g prefix C-q
bind-key C-q send-prefix

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind q kill-pane
bind x confirm-before -p "kill-window #W? (y/n)" kill-window
bind D detach-client
unbind &

setw -g mode-keys vi
bind e copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send-keys -X page-up
bind -T copy-mode-vi C-d send-keys -X page-down
unbind [

set -g mouse on

bind -n M-H select-pane -L
bind -n M-L select-pane -R
bind -n M-K select-pane -U
bind -n M-J select-pane -D

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

set -g set-titles on

set-option -g status-right ""

bind C display-popup -b rounded -T " clone " -w 50% -h 3 -E "pclone"
bind J display-popup -d "#{pane_current_path}" -h 90% -w 90% -E 'lazyjournal -T "$(date +%:z)"'
bind N display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "rustnet"
bind b display-popup -d "#{pane_current_path}" -b rounded -T " worktree " -w 60% -h 60% -E "wtree"
bind d display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "~/.config/tmux/popup.nu sudo lazydocker"
bind g display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "~/.config/tmux/popup.nu -e gh-dash"
bind j display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "~/.config/tmux/popup.nu -e lazyjj"
bind k display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "~/.config/tmux/popup.nu -e k9s"
bind S display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "~/.config/tmux/popup.nu -e lazysql"
bind m display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "$DOTFILES/scripts/toggles/menu.nu --fzf"
bind n display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "~/.config/tmux/popup.nu netscanner"
bind p display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "btop"
bind t display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "~/.config/tmux/popup.nu -e taskwarrior-tui"
bind w display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "tms"
bind z display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "zsh"

run-shell ~/.config/tmux/autoreload.nu
run-shell "tmux-fingers load-config"

source-file -q ~/.cache/wal/colors-tmux.conf
