{% set bg_alt = background | blend(foreground) | blend(background) | blend(background) -%}
{% set fg_dim = foreground | blend(background) | blend(foreground) -%}

[mgr]
cwd = { fg = "{{color4}}", bold = true }

find_keyword  = { fg = "{{color3}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{color5}}", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "{{color8}}", italic = true }

marker_copied   = { fg = "{{color2}}", bg = "{{color2}}" }
marker_cut      = { fg = "{{color1}}", bg = "{{color1}}" }
marker_marked   = { fg = "{{color6}}", bg = "{{color6}}" }
marker_selected = { fg = "{{color4}}", bg = "{{color4}}" }

count_copied   = { fg = "{{background}}", bg = "{{color2}}" }
count_cut      = { fg = "{{background}}", bg = "{{color1}}" }
count_selected = { fg = "{{background}}", bg = "{{color4}}" }

border_style = { fg = "{{color8}}" }

[tabs]
active   = { fg = "{{background}}", bg = "{{color4}}", bold = true }
inactive = { fg = "{{fg_dim}}", bg = "{{bg_alt}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{background}}", bg = "{{color4}}", bold = true }
normal_alt  = { fg = "{{color4}}", bg = "{{bg_alt}}" }
select_main = { fg = "{{background}}", bg = "{{color5}}", bold = true }
select_alt  = { fg = "{{color5}}", bg = "{{bg_alt}}" }
unset_main  = { fg = "{{background}}", bg = "{{color1}}", bold = true }
unset_alt   = { fg = "{{color1}}", bg = "{{bg_alt}}" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep        = { fg = "{{color8}}" }
perm_type       = { fg = "{{color4}}" }
perm_read       = { fg = "{{color3}}" }
perm_write      = { fg = "{{color1}}" }
perm_exec       = { fg = "{{color2}}" }
progress_label  = { fg = "{{color15}}", bold = true }
progress_normal = { fg = "{{color4}}", bg = "{{bg_alt}}" }
progress_error  = { fg = "{{color1}}", bg = "{{bg_alt}}" }

[which]
cand            = { fg = "{{color6}}" }
rest            = { fg = "{{color8}}" }
desc            = { fg = "{{color5}}" }
separator_style = { fg = "{{color8}}" }
mask            = { bg = "{{bg_alt}}" }

[confirm]
border  = { fg = "{{color4}}" }
title   = { fg = "{{color4}}" }
btn_yes = { fg = "{{background}}", bg = "{{color4}}", bold = true }
btn_no  = { fg = "{{fg_dim}}" }

[spot]
border   = { fg = "{{color4}}" }
title    = { fg = "{{color4}}" }
tbl_col  = { fg = "{{color4}}" }
tbl_cell = { fg = "{{color5}}", reversed = true }

[notify]
title_info  = { fg = "{{color2}}" }
title_warn  = { fg = "{{color3}}" }
title_error = { fg = "{{color1}}" }

[pick]
border = { fg = "{{color4}}" }
active = { fg = "{{color5}}", bold = true }

[input]
border   = { fg = "{{color4}}" }
value    = { fg = "{{foreground}}" }
selected = { reversed = true }

[cmp]
border = { fg = "{{color4}}" }
active = { reversed = true }

[tasks]
border  = { fg = "{{color4}}" }
hovered = { fg = "{{color5}}", bold = true }

[help]
border  = { fg = "{{color4}}" }
chord   = { fg = "{{color6}}" }
hovered = { fg = "{{background}}", bg = "{{color4}}", bold = true }
