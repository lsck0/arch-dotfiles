# loaded only when a game opts in with ENABLE_VKBASALT=1 (launch options: configs/gaming/gamemode/gamemode.ini)
# built-in effects only, no reshade shaders; cas first so smaa smooths the sharpened edges
effects = cas:smaa

# Home: the one key vkBasalt reads without modifiers that the sofle keymap has and MangoHud (Shift_R+F12) does not use
toggleKey = Home
enableOnLaunch = True

# AMD FidelityFX CAS strength, 0 to 1; 0.4 sharpens TAA blur without halos
casSharpness = 0.4

# luma edges are cheaper than color and miss little on game content
smaaEdgeDetection = luma
smaaThreshold = 0.05
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25
