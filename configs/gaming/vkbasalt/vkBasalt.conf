# cas first so smaa smooths the sharpened edges
effects = cas:smaa

# Home: unmodified, on the sofle keymap and unused by MangoHud
toggleKey = Home
enableOnLaunch = True

# 0.4 sharpens TAA blur without halos
casSharpness = 0.4

# luma edges are cheaper than color and miss little on game content
smaaEdgeDetection = luma
smaaThreshold = 0.05
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25
