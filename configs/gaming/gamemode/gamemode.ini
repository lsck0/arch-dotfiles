; gamemoded merges this over /usr/share/gamemode/gamemode.ini and rereads it on change.
; steam games get the mangohud overlay (hidden, Shift_R+F12) and obs capture via configs/gaming/steam/steam-launch.nu,
; gamemode only per game: launch options `gamemoderun %command%`, the same for any other launcher.
; per game extras: `ENABLE_VKBASALT=1 %command%` for sharpening and smaa (Home toggles it),
; `gamescope -f --mangoapp -- %command%` to cap fps or upscale a single demanding title.
; Lutris and Heroic request gamemode themselves.

[general]
; nice -10, /etc/security/limits.d/10-gamemode.conf allows it for the gamemode group
renice=10

[cpu]
; pin the game to the cores with the largest l3 (an x3d's v-cache ccd), detected per core from cache/index3/size
pin_cores=yes
; no parking: obs, discord and the browser keep the frequency ccd, which amd_x3d_vcache's default frequency mode prefers
park_cores=no

[custom]
start=$HOME/.local/bin/gamemode-hook start
end=$HOME/.local/bin/gamemode-hook end
