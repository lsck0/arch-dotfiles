# hidden until mangohud-toggle (shift+f12, a hyprland bind) flips it over the control socket: mangohud's own key
# polling missed shift_r+f12 in proton games here, and where it does see the key it would flip a second time.
# no logging unless toggle_logging (Shift_L+F2)
no_display
toggle_hud=
control=mangohud-%p

hud_compact
position=top-left
font_size=18
background_alpha=0.4
round_corners=4

fps
frametime
frame_timing
cpu_stats
cpu_temp
cpu_power
gpu_stats
gpu_temp
gpu_power
vram
