<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>home</title>
    <style>
      :root {
        --background: #07090d;
        --foreground: #bfbdb6;
        --muted: #565b66;
        --cell: #59c2ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* absolute file:// so it resolves even though startpage.html is a symlink (Firefox resolves relative URLs from the symlink's real repo path) */
        background:
          linear-gradient(rgba(7, 9, 13, 0.78), rgba(7, 9, 13, 0.78)),
          url("file:///home/luca/.cache/wal/wallpaper") center / cover no-repeat fixed;
        background-color: var(--background);
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
      }
      #clock {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        font-family: "Kode Mono", monospace;
        color: var(--foreground);
        text-align: center;
        user-select: none;
        pointer-events: none;
      }
      #time {
        font-size: 5.5rem;
        font-weight: 600;
        letter-spacing: 2px;
      }
      #date {
        font-size: 1.1rem;
        color: var(--muted);
        margin-top: 0.3rem;
      }
      #search {
        position: fixed;
        left: 50%;
        top: calc(50% + 8rem);
        transform: translateX(-50%);
        z-index: 3;
        width: min(38rem, 80vw);
        /* hidden until the first printable keypress reveals it (see script) */
        display: none;
      }
      #q {
        width: 100%;
        box-sizing: border-box;
        padding: 0.7rem 1rem;
        font-family: "Kode Mono", monospace;
        font-size: 1.1rem;
        color: var(--foreground);
        background: rgba(7, 9, 13, 0.72);
        border: 1px solid var(--cell);
        border-radius: 6px;
        outline: none;
        text-align: center;
      }
      #q::placeholder {
        color: var(--muted);
      }
    </style>
    <link rel="stylesheet" href="file:///home/luca/.cache/wal/colors-qutebrowser.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <form id="search" action="https://www.google.com/search" method="get">
      <input id="q" name="q" type="text" autocomplete="off"
             placeholder="search google" />
    </form>
    <script>
      "use strict";

      // Digital-rain background ported from the quickshell matrix lockscreen (plugins/matrixrain/MatrixRain.qml): glyph pool, trail-fade paint, accent heads, per-column drops.
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");

      const style = getComputedStyle(document.documentElement);
      const head_color = style.getPropertyValue("--cell").trim();

      const cell_size = 18;
      const trail_fade = 0.12;
      const charset = "01<>[]{}/\\|=+-*!?$#@abcdef0123456789";

      function glyph() {
        return charset.charAt(Math.floor(Math.random() * charset.length));
      }

      let columns = 0;
      let rows = 0;
      let drops = [];

      function seed_drops() {
        drops = [];
        for (let c = 0; c < columns; c++) {
          drops.push({
            y: -Math.floor(Math.random() * rows),
            speed: 0.4 + Math.random() * 0.9,
          });
        }
      }

      function resize() {
        const ratio = window.devicePixelRatio || 1;

        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);

        columns = Math.ceil(window.innerWidth / cell_size);
        rows = Math.ceil(window.innerHeight / cell_size);

        seed_drops();
      }

      function draw() {
        // Fade trails toward TRANSPARENT (erase), so the wallpaper shows through.
        context.globalCompositeOperation = "destination-out";
        context.fillStyle = "rgba(0, 0, 0, " + trail_fade + ")";
        context.fillRect(0, 0, window.innerWidth, window.innerHeight);
        context.globalCompositeOperation = "source-over";

        context.fillStyle = head_color;
        context.font = cell_size + "px \"Kode Mono\", monospace";
        context.textBaseline = "top";

        for (let i = 0; i < drops.length; i++) {
          const row = Math.floor(drops[i].y);
          if (row >= 0 && row <= rows) {
            context.fillText(glyph(), i * cell_size, row * cell_size);
          }

          drops[i].y += drops[i].speed;
          if (drops[i].y - 16 > rows && Math.random() > 0.975) {
            drops[i].y = -Math.floor(Math.random() * 8);
            drops[i].speed = 0.4 + Math.random() * 0.9;
          }
        }
      }

      const step_interval = 80;
      let last_step = 0;

      function frame(now) {
        if (now - last_step >= step_interval) {
          draw();
          last_step = now;
        }
        requestAnimationFrame(frame);
      }

      function update_clock() {
        const now = new Date();
        const pad = function (number) {
          return String(number).padStart(2, "0");
        };

        document.getElementById("time").textContent =
          pad(now.getHours()) + ":" + pad(now.getMinutes());
        document.getElementById("date").textContent = now.toLocaleDateString(
          undefined,
          { weekday: "long", day: "numeric", month: "long" },
        );
      }

      window.addEventListener("resize", resize);

      resize();
      requestAnimationFrame(frame);

      update_clock();
      setInterval(update_clock, 10000);

      // Search box is hidden until the first printable keypress; the char that
      // triggers it is appended manually so it is never dropped.
      const search_form = document.getElementById("search");
      const search_input = document.getElementById("q");

      function hide_search() {
        search_form.style.display = "none";
        search_input.value = "";
      }

      document.addEventListener("keydown", function (event) {
        if (document.activeElement === search_input) return; // already typing
        if (event.ctrlKey || event.altKey || event.metaKey) return;
        if (event.key.length !== 1) return; // one printable char only
        event.preventDefault();
        search_form.style.display = "block";
        search_input.value += event.key;
        search_input.focus();
      });

      search_input.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          hide_search();
          search_input.blur();
        }
      });
      search_input.addEventListener("blur", function () {
        if (search_input.value === "") hide_search();
      });
    </script>
  </body>
</html>
