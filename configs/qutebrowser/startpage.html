<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>start</title>
    <style>
      :root {
        --background: #07090d;
        --foreground: #bfbdb6;
        --muted: #565b66;
        --cell: #59c2ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* absolute file:// so it resolves even though startpage.html is a symlink (Firefox resolves relative URLs from the symlink's real repo path) */
        background:
          linear-gradient(rgba(7, 9, 13, 0.78), rgba(7, 9, 13, 0.78)),
          url("file:///home/luca/.cache/wal/wallpaper") center / cover no-repeat fixed;
        background-color: var(--background);
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
      }
      #clock {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        font-family: "Tektur", monospace;
        color: var(--foreground);
        text-align: center;
        user-select: none;
        pointer-events: none;
      }
      #time {
        font-size: 5.5rem;
        font-weight: 600;
        letter-spacing: 2px;
      }
      #date {
        font-size: 1.1rem;
        color: var(--muted);
        margin-top: 0.3rem;
      }
    </style>
    <link rel="stylesheet" href="file:///home/luca/.cache/wal/colors-qutebrowser.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <script>
      "use strict";

      // Digital-rain background ported from the quickshell matrix lockscreen (plugins/matrixrain/MatrixRain.qml): glyph pool, trail-fade paint, accent heads, per-column drops.
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");

      const style = getComputedStyle(document.documentElement);
      const head_color = style.getPropertyValue("--cell").trim();

      const cell_size = 18;
      const trail_fade = 0.12;
      const charset = "01<>[]{}/\\|=+-*!?$#@abcdef0123456789";

      function glyph() {
        return charset.charAt(Math.floor(Math.random() * charset.length));
      }

      let columns = 0;
      let rows = 0;
      let drops = [];

      function seed_drops() {
        drops = [];
        for (let c = 0; c < columns; c++) {
          drops.push({
            y: -Math.floor(Math.random() * rows),
            speed: 0.4 + Math.random() * 0.9,
          });
        }
      }

      function resize() {
        const ratio = window.devicePixelRatio || 1;

        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);

        columns = Math.ceil(window.innerWidth / cell_size);
        rows = Math.ceil(window.innerHeight / cell_size);

        seed_drops();
      }

      function draw() {
        // Fade trails toward TRANSPARENT (erase), so the wallpaper shows through.
        context.globalCompositeOperation = "destination-out";
        context.fillStyle = "rgba(0, 0, 0, " + trail_fade + ")";
        context.fillRect(0, 0, window.innerWidth, window.innerHeight);
        context.globalCompositeOperation = "source-over";

        context.fillStyle = head_color;
        context.font = cell_size + "px \"Tektur\", monospace";
        context.textBaseline = "top";

        for (let i = 0; i < drops.length; i++) {
          const row = Math.floor(drops[i].y);
          if (row >= 0 && row <= rows) {
            context.fillText(glyph(), i * cell_size, row * cell_size);
          }

          drops[i].y += drops[i].speed;
          if (drops[i].y - 16 > rows && Math.random() > 0.975) {
            drops[i].y = -Math.floor(Math.random() * 8);
            drops[i].speed = 0.4 + Math.random() * 0.9;
          }
        }
      }

      const step_interval = 80;
      let last_step = 0;

      function frame(now) {
        if (now - last_step >= step_interval) {
          draw();
          last_step = now;
        }
        requestAnimationFrame(frame);
      }

      function update_clock() {
        const now = new Date();
        const pad = function (number) {
          return String(number).padStart(2, "0");
        };

        document.getElementById("time").textContent =
          pad(now.getHours()) + ":" + pad(now.getMinutes());
        document.getElementById("date").textContent = now.toLocaleDateString(
          undefined,
          { weekday: "long", day: "numeric", month: "long" },
        );
      }

      window.addEventListener("resize", resize);

      resize();
      requestAnimationFrame(frame);

      update_clock();
      setInterval(update_clock, 10000);
    </script>
  </body>
</html>
