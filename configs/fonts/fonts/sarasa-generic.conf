<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig 2.17+ ranks every font holding the asked genericfamily (VL Gothic, Droid Sans) above the weak family
     list, and fixes a font's genericfamily when the cache is built, partly from the aliases naming it. Root builds the
     cache for /usr/share/fonts without the user's 50-dotfiles.conf, so Sarasa Gothic got none there and Han text under
     sans-serif without a lang tag took VL Gothic's Japanese forms over the SC fallback. The scan rule sits where that
     cache is built -->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains"><string>Sarasa Gothic</string></test>
    <edit name="genericfamily" mode="assign"><const>sans-serif</const></edit>
  </match>
</fontconfig>
