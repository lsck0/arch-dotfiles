<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Default family preferences + rendering. ~150 families are installed; without this, generic sans/serif/mono
     and CJK/emoji fallback are left to fontconfig's guesses. Missing families are skipped, so this stays valid
     even on a box with a smaller font set. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
      <family>Open Sans</family>
      <family>Noto Sans</family>
      <family>Sarasa Gothic</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Sarasa Gothic</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Kode Mono</family>
      <family>CaskaydiaCove Nerd Font</family>
      <family>Sarasa Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- map the generic "emoji" family to the colour emoji font -->
  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>

  <!-- rendering: slight hinting + subpixel, no bitmap glyphs -->
  <match target="font"><edit name="antialias" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><edit name="hinting" mode="assign"><bool>true</bool></edit></match>
  <match target="font"><edit name="hintstyle" mode="assign"><const>hintslight</const></edit></match>
  <match target="font"><edit name="rgba" mode="assign"><const>rgb</const></edit></match>
  <match target="font"><edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit></match>
  <match target="font"><edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit></match>
</fontconfig>
