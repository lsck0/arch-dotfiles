# X870E AORUS ELITE WIFI7 carries an ITE IT8689E/IT87952E SuperIO the mainline it87 refuses by id.
# force_id makes the frankcrawford/it87 fork bind anyway; ignore_resource_conflict lets it claim the
# ACPI-reserved region. 0x8622 is the usual id for recent Gigabyte boards: if `sensors` shows no it87
# chip after a reboot, read `dmesg | grep it87` and the fork's README for the id this board reports.
options it87 force_id=0x8622 ignore_resource_conflict=1
