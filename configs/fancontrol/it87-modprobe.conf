# X870E AORUS ELITE WIFI7's ITE IT8689E/IT87952E SuperIO: force_id makes the frankcrawford/it87 fork bind (mainline refuses by id), ignore_resource_conflict claims the ACPI-reserved region; 0x8622 is the usual id for recent Gigabyte boards, check `dmesg | grep it87` and the fork's README if `sensors` shows no it87 chip
options it87 force_id=0x8622 ignore_resource_conflict=1
