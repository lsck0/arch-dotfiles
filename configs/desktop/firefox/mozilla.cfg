// firefox skips the first line of this file
// new tab shows the start page (bookmarks from weblinks) instead of activity stream
const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
AboutNewTab.newTabURL = "file://" + getenv("HOME") + "/.config/qutebrowser/startpage.html";

// hardening the Preferences policy may not set (policies.json has the rest); here it reaches every profile, also
// one made after the last config run
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
// strict etp's tracking-parameter stripping, which the custom etp in policies.json does not switch on
defaultPref("privacy.query_stripping.enabled", true);
defaultPref("privacy.query_stripping.enabled.pbmode", true);
// tls 0-rtt early data can be replayed
defaultPref("security.tls.enable_0rtt_data", false);

// Ctrl+V with nothing editable focused focuses the address bar and pastes, so you don't have to click/type first.
// If a text field (incl. the urlbar or a page input) already has focus, the normal paste is left untouched.
(function () {
  function hook(win) {
    if (win.document.documentElement.getAttribute("windowtype") !== "navigator:browser") return;
    win.addEventListener("keydown", function (e) {
      if (!e.ctrlKey || e.shiftKey || e.altKey || e.metaKey) return;
      if (e.key !== "v" && e.key !== "V") return;
      const el = win.document.activeElement;
      if (el && (el.isContentEditable || /^(input|textarea)$/i.test(el.tagName))) return;
      if (!win.gURLBar) return;
      e.preventDefault();
      win.gURLBar.focus();
      win.gURLBar.select();
      win.goDoCommand("cmd_paste");
    }, true);
  }
  Services.wm.addListener({
    onOpenWindow(xulWin) {
      const win = xulWin.docShell.domWindow;
      win.addEventListener("load", () => hook(win), { once: true });
    },
    onCloseWindow() {},
    onWindowTitleChange() {},
  });
})();
