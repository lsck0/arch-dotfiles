hwdec=@HWDEC@
vo=gpu-next
keep-open=yes
# off where core/yt-dlp is vpn-routed, yt-dlp then running only in the protonvpn namespace (mpv-stream starts mpv
# there with ytdl on); on elsewhere
ytdl=@YTDL@
ytdl-format=bestvideo[height<=?@YTDL_MAX_HEIGHT@]+bestaudio/best
ytdl-raw-options=ignore-config=
script-opts-append=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
screenshot-dir=@SCREENSHOTS@
screenshot-format=png
