# the default audio and video player (configs/base/xdg/mimeapps.list); mpv-mpris makes it an mpris player, so
# playerctl, the media keys, quickshell's media widget and idle-guards' media-guard see it. the stock osc stays: it
# has no colors of its own, so it fits any theme

# hardware decoding where it is known to be correct, the libplacebo renderer
hwdec=auto-safe
vo=gpu-next
# the last frame stays up at the end instead of the window closing
keep-open=yes
# tags the stream Music or Movie, so wireplumber routes it into the media lane's leveler (desktop/pipewire)
audio-set-media-role=yes
# streams through yt-dlp at most 4k, but only inside the protonvpn namespace: plain mpv runs no yt-dlp at all, so a
# url never resolves over the real link; mpv-stream (base/protonvpn-netns) is mpv in the namespace with --ytdl=yes.
# the packaged yt-dlp there, not the shim: apparmor confines it in a child of mpv (base/apparmor local/mpv), and the
# download config (archive, ~/downloads) stays out of streaming
ytdl=no
ytdl-format=bestvideo[height<=?2160]+bestaudio/best
ytdl-raw-options=ignore-config=
script-opts-append=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
# --input-ipc-server works only on the paths apparmor lets mpv bind (base/apparmor local/mpv): $XDG_RUNTIME_DIR/*mpv*.sock,
# anything under $XDG_RUNTIME_DIR/mpv/, or /tmp/*mpv* such as the man page's /tmp/mpvsocket
screenshot-dir=~/pictures/screenshots
screenshot-format=png
