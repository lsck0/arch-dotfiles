# the stock osc stays: it has no colors of its own, so it fits any theme

hwdec=auto-safe
vo=gpu-next
keep-open=yes
# tags the stream Music or Movie, so wireplumber routes it into the media lane's leveler (desktop/pipewire)
audio-set-media-role=yes
# no yt-dlp outside the protonvpn namespace, so a url never resolves over the real link; mpv-stream runs mpv in it
ytdl=no
ytdl-format=bestvideo[height<=?2160]+bestaudio/best
ytdl-raw-options=ignore-config=
script-opts-append=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
# --input-ipc-server binds only where apparmor allows (local/mpv): $XDG_RUNTIME_DIR/*mpv*.sock or mpv/, /tmp/*mpv*
screenshot-dir=~/pictures/screenshots
screenshot-format=png
