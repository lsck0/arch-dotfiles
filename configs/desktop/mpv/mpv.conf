hwdec=auto-safe
vo=gpu-next
keep-open=yes
# yt-dlp runs only inside the protonvpn namespace: mpv-stream starts mpv there with ytdl on
ytdl=no
ytdl-format=bestvideo[height<=?@YTDL_MAX_HEIGHT@]+bestaudio/best
ytdl-raw-options=ignore-config=
script-opts-append=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
screenshot-dir=~/pictures/screenshots
screenshot-format=png
