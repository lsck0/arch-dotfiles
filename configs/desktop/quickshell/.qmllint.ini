; qmllint settings for this tree, found by walking up from each linted file. `dot test check` runs the Qt 6 qmllint
; with an import dir whose qs/ links here (quickshell's own `qs.` import root) and fails on any warning.
; Everything not listed keeps qmllint's default level.
[Warnings]
; quickshell exports PanelWindow as an uncreatable interface and swaps in the layer-shell backend at runtime, so
; every PanelWindow declaration trips this; no other uncreatable type is used here
UncreatableType=disable
; default is info, which never fails the gate; a dead import is a real finding here
UnusedImports=warning
