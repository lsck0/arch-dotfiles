# read at request time, an edit needs no restart
screencopy {
    # "Allow a restore token" starts ticked, so obs gets a token on the first pick instead of a picker every launch
    allow_token_by_default = true

    # live thumbnails, unlike the stock qt list; its "Remember this choice" box is pre-ticked only through
    # allow_token_by_default above, whatever the package README says
    custom_picker_binary = omarchy-share-picker
}
