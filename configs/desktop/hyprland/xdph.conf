# xdg-desktop-portal-hyprland, read at request time: no restart needed after an edit.
screencopy {
    # the share picker's "Allow a restore token" box starts ticked, so obs and friends are granted a token on the
    # first pick and never prompt again. Without it every launch re-opens the picker.
    allow_token_by_default = true

    # omarchy-share-picker: live thumbnails per screen and window, unlike the stock qt list.
    # xdph passes --allow-token when allow_token_by_default is on, which pre-ticks its
    # "Remember this choice" box, so keep that true (the package README says otherwise).
    custom_picker_binary = omarchy-share-picker
}
