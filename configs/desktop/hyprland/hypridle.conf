general {
    lock_cmd = ~/.config/hypr/quickshell-lock-launch.sh  # quickshell is the only locker
    before_sleep_cmd = ~/.config/hypr/quickshell-lock-launch.sh  # locks and blocks until the lock engages, so the freeze cannot race the lock handshake and abort quickshell
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"  # else a key must be pressed twice to wake the display
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/screen-dim.sh dim  # backlight or ddc/ci, min not 0 on oled
    on-resume = ~/.config/hypr/screen-dim.sh restore
}

listener {
    timeout = 1200
    on-timeout = loginctl lock-session  # no on-resume: only auth dismisses a lock
    condition_cmd = ~/.config/hypr/idle-media-guard.sh  # not while media plays
    condition_retry = 60
}

listener {
    timeout = 2100  # the lock screen stays up 15 min before the screens go off
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ mode = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"
}

listener {
   timeout = 600  # saver (on battery, or forced) suspends early; no retry, it would poll every idle minute otherwise
   on-timeout = systemctl suspend
   condition_cmd = grep -qsx on "$XDG_RUNTIME_DIR/toggles/powersaver" && ~/.config/hypr/idle-media-guard.sh && ~/.config/hypr/ssh-inhibit-guard.sh && ~/.config/hypr/claude-busy-guard.sh
}

listener {
   timeout = 2400
   on-timeout = systemctl suspend
   condition_cmd = ~/.config/hypr/idle-media-guard.sh && ~/.config/hypr/ssh-inhibit-guard.sh && ~/.config/hypr/claude-busy-guard.sh  # not while media plays, ssh is in, or claude works
   condition_retry = 60
}
