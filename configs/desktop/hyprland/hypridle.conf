general {
    lock_cmd = ~/.config/hypr/quickshell-lock-launch.nu  # quickshell, hyprlock when quickshell is unreachable
    before_sleep_cmd = ~/.config/hypr/quickshell-lock-launch.nu  # locks and blocks until the lock engages, so the freeze cannot race the lock handshake and abort quickshell
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"  # else a key must be pressed twice to wake the display
}

listener {
    timeout = @DIM_S@
    on-timeout = ~/.config/hypr/screen-dim.nu dim  # backlight or ddc/ci, min not 0 on oled
    on-resume = ~/.config/hypr/screen-dim.nu restore
}

listener {
    timeout = @LOCK_S@
    on-timeout = loginctl lock-session  # no on-resume: only auth dismisses a lock; media and ssh hold only sleep inhibitors (idle-guards), so lock still happens
}

listener {
    timeout = @DPMS_S@  # after the lock, so the lock screen stays up a while before the screens go off
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ mode = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"
}

listener {
   timeout = @SUSPEND_SAVER_S@  # saver (on battery, or forced) suspends early; no retry, it would poll every idle minute; the listener below retries
   on-timeout = systemctl suspend
   condition_cmd = grep -qsx on "$XDG_RUNTIME_DIR/toggles/powersaver" && ! ~/.config/idle-guards/agent-guard.nu busy && ! busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager BlockInhibited | grep -qw sleep
}

listener {
   timeout = @SUSPEND_S@
   on-timeout = systemctl suspend
   condition_cmd = ! ~/.config/idle-guards/agent-guard.nu busy && ! busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager BlockInhibited | grep -qw sleep  # no attempt while an agent works or a sleep inhibitor (media, ssh) blocks; the retry suspends once it clears
   condition_retry = 60
}
