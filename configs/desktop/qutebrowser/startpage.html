<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>home</title>
    <style>
      :root {
        --bg: @BG@;
        --surface: @SURFACE@;
        --fg: @FG@;
        --muted: @MUTED@;
        --accent: @ACCENT@;
        --accent2: @ACCENT2@;
        --radius: @RADIUS@px;
        font-family: "@FONT@", monospace;
        font-size: 15px;
        color: var(--fg);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background:
          linear-gradient(color-mix(in srgb, var(--bg) 82%, transparent), color-mix(in srgb, var(--bg) 82%, transparent)),
          url("file://@HOME@/.cache/wal/wallpaper") center / cover no-repeat fixed;
        background-color: var(--bg);
        display: flex;
        min-height: 100vh;
        padding: 3vh 0;
      }
      main {
        margin: auto;
        width: min(68rem, 94vw);
        padding: 1.6rem 2rem 1.8rem;
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-radius: var(--radius);
      }
      header { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; }
      .head { color: var(--accent2); font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; }
      #prompt {
        display: flex; align-items: center; gap: 0.6rem;
        margin: 1.1rem 0 1.4rem; padding: 0.55rem 0.8rem;
        border: 1px solid var(--accent); border-radius: var(--radius);
        background: color-mix(in srgb, var(--bg) 70%, transparent);
      }
      #prompt span { color: var(--accent); font-weight: 700; }
      #q {
        flex: 1; border: 0; outline: 0; background: transparent;
        color: var(--fg); font: inherit; font-size: 1.1rem;
      }
      #q::placeholder { color: var(--muted); }
      #hint { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
      #groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: 1.1rem 1.6rem; }
      section h2 { margin: 0 0 0.45rem; font-size: 0.8rem; }
      section a {
        display: flex; gap: 0.5rem; padding: 0.12rem 0.3rem; margin: 0 -0.3rem;
        color: var(--fg); text-decoration: none; border-radius: var(--radius);
      }
      section a .key { color: var(--muted); min-width: 1ch; }
      section a:hover, section a.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      section a.sel { color: var(--accent); }
      section a.sel .key { color: var(--accent); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><span class="head">&gt; home</span><span id="clock"></span></header>
      <div id="prompt"><span>&gt;</span><input id="q" autocomplete="off" autofocus placeholder="filter, url or search" /><span id="hint"></span></div>
      <div id="groups"></div>
    </main>
    <script src="file://@DATA@/weblinks/links.js"></script>
    <script>
      "use strict";
      const SEARCH = "@SEARCH@";
      const links = typeof weblinks === "undefined" ? [] : weblinks;
      const q = document.getElementById("q");
      const hint = document.getElementById("hint");
      const groups = document.getElementById("groups");
      const items = [];

      for (const link of links) {
        let box = groups.querySelector(`section[data-g="${link.group}"]`);
        if (!box) {
          box = document.createElement("section");
          box.dataset.g = link.group;
          const h = document.createElement("h2");
          h.className = "head";
          h.textContent = "> " + link.group;
          box.appendChild(h);
          groups.appendChild(box);
        }
        const a = document.createElement("a");
        a.href = link.url;
        a.innerHTML = '<span class="key"></span><span></span>';
        a.lastChild.textContent = link.name;
        box.appendChild(a);
        items.push({ a: a, box: box, text: (link.name + " " + link.group + " " + link.url).toLowerCase() });
      }

      function asUrl(text) {
        const t = text.trim();
        if (t === "" || /\s/.test(t)) return null;
        if (/^(https?|file|ftp|about|qute|chrome|view-source|data):/i.test(t)) return t;
        if (/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/.*)?$/i.test(t)) return "http://" + t;
        if (/^[^\/:]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(t)) return "https://" + t;
        return null;
      }

      function score(query, text) {
        let at = 0, s = 0, run = 0;
        for (const ch of query) {
          const i = text.indexOf(ch, at);
          if (i < 0) return -1;
          run = i === at ? run + 1 : 0;
          s += run + (i === 0 ? 2 : 0);
          at = i + 1;
        }
        return s;
      }

      let shown = [];
      let sel = 0;

      function render() {
        const query = q.value.trim().toLowerCase();
        const url = asUrl(q.value);
        shown = [];
        for (const it of items) {
          const s = query === "" ? 0 : score(query, it.text);
          it.a.hidden = s < 0;
          if (s >= 0) shown.push({ it: it, s: s });
        }
        if (query !== "") shown.sort((x, y) => y.s - x.s);
        for (const box of groups.children) box.hidden = !box.querySelector("a:not([hidden])");
        sel = Math.min(sel, Math.max(shown.length - 1, 0));
        items.forEach((it) => { it.a.classList.remove("sel"); it.a.firstChild.textContent = ""; });
        shown.slice(0, 9).forEach((m, i) => { m.it.a.firstChild.textContent = String(i + 1); });
        if (query !== "" && shown.length > 0 && !url) shown[sel].it.a.classList.add("sel");
        hint.textContent = url ? "enter: open url" : query === "" ? "type to filter, ctrl+1-9 open" : shown.length ? "enter: open, shift+enter: search" : "enter: search";
      }

      function go(href) { window.location.href = href; }
      function search(text) { go(SEARCH.replace("{}", encodeURIComponent(text.trim()))); }

      q.addEventListener("input", () => { sel = 0; render(); });
      q.addEventListener("paste", (e) => {
        const url = asUrl((e.clipboardData || window.clipboardData).getData("text"));
        if (url) { e.preventDefault(); go(url); }
      });
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && /^[1-9]$/.test(e.key)) {
          const m = shown[Number(e.key) - 1];
          if (m) { e.preventDefault(); go(m.it.a.href); }
          return;
        }
        if (e.key === "Escape") { q.value = ""; sel = 0; render(); return; }
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          if (shown.length === 0) return;
          e.preventDefault();
          sel = (sel + (e.key === "ArrowDown" ? 1 : shown.length - 1)) % shown.length;
          render();
          return;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          const text = q.value;
          if (text.trim() === "") return;
          const url = asUrl(text);
          if (url) go(url);
          else if (!e.shiftKey && shown.length > 0) go(shown[sel].it.a.href);
          else search(text);
          return;
        }
        if (document.activeElement !== q && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) q.focus();
      });

      function tick() {
        const d = new Date();
        const two = (n) => String(n).padStart(2, "0");
        document.getElementById("clock").textContent =
          d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }).toLowerCase() + "  " + two(d.getHours()) + ":" + two(d.getMinutes());
      }
      tick();
      setInterval(tick, 15000);
      render();
      q.focus();
    </script>
  </body>
</html>
