<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>home</title>
    <style>
      :root {
        --bg: @BG@;
        --surface: @SURFACE@;
        --fg: @FG@;
        --muted: @MUTED@;
        --accent: @ACCENT@;
        --accent2: @ACCENT2@;
        --radius: @RADIUS@px;
        font-family: "@FONT@", monospace;
        font-size: @FONT_SIZE@pt;
        color: var(--fg);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background:
          linear-gradient(color-mix(in srgb, var(--bg) 82%, transparent), color-mix(in srgb, var(--bg) 82%, transparent)),
          url("file://@CACHE@/wal/wallpaper") center / cover no-repeat fixed;
        background-color: var(--bg);
        display: flex;
        min-height: 100vh;
        padding: 3vh 0;
      }
      main {
        margin: 12vh auto auto;
        width: min(68rem, 94vw);
        padding: 1.6rem 2rem 1.8rem;
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-radius: var(--radius);
      }
      header { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; }
      .head { color: var(--accent2); font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; }
      #prompt {
        display: flex; align-items: center; gap: 0.6rem;
        margin: 1.1rem 0 1.4rem; padding: 0.55rem 0.8rem;
        border: 1px solid var(--accent); border-radius: var(--radius);
        background: color-mix(in srgb, var(--bg) 70%, transparent);
      }
      #prompt > span:first-child { color: var(--accent); font-weight: 700; }
      #q {
        flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
        color: var(--fg); font: inherit; font-size: 1.1rem;
      }
      #q::placeholder { color: var(--muted); }
      #hint { color: var(--muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      @media (max-width: 40rem) { #hint { display: none; } }
      #groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: 1.1rem 1.6rem; }
      section h2 { margin: 0 0 0.45rem; font-size: 0.8rem; }
      a.link {
        display: flex; gap: 0.5rem; padding: 0.12rem 0.3rem; margin: 0 -0.3rem;
        color: var(--fg); text-decoration: none; border-radius: var(--radius);
      }
      a.link .key { color: var(--muted); min-width: 1ch; }
      a.link .group { display: none; margin-left: auto; color: var(--muted); }
      #matches a.link .group { display: inline; }
      a.link:hover, a.link.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      /* accent text on the accent tint stays under 4.5:1, so the selection is marked by an accent edge instead */
      a.link.sel { box-shadow: inset 2px 0 var(--accent); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><span class="head">&gt; home</span><span id="clock"></span></header>
      <form id="prompt"><span>&gt;</span><input id="q" name="q" autocomplete="off" autofocus placeholder="filter, url or search" /><span id="hint"></span></form>
      <div id="groups"></div>
      <div id="matches" hidden></div>
    </main>
    <script src="file://@DATA@/weblinks/links.js"></script>
    <script>
      "use strict";
      const SEARCH = @SEARCH@;
      const METHOD = "@METHOD@";
      // split the "<base>?<param>={}" template into a real form target, so Enter submits natively (honours POST)
      const sm = SEARCH.match(/^([^?]*)\?([^=&]+)=\{\}$/);
      const SEARCH_ACTION = sm ? sm[1] : SEARCH;
      const SEARCH_PARAM = sm ? sm[2] : "q";
      const links = typeof weblinks === "undefined" ? [] : weblinks;
      const form = document.getElementById("prompt");
      const q = document.getElementById("q");
      const hint = document.getElementById("hint");
      // a POST search needs a real form: point it at the engine, and the keydown handler lets Enter submit it natively
      form.action = SEARCH_ACTION;
      form.method = METHOD;
      q.name = SEARCH_PARAM;
      const groups = document.getElementById("groups");
      const matches = document.getElementById("matches");
      const items = [];
      const boxes = new Map();

      function words(text) {
        return text.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter((w) => w !== "");
      }

      for (const link of links) {
        let box = boxes.get(link.group);
        if (!box) {
          box = document.createElement("section");
          box.dataset.g = link.group;
          const h = document.createElement("h2");
          h.className = "head";
          h.textContent = "> " + link.group;
          box.appendChild(h);
          box.order = boxes.size;
          groups.appendChild(box);
          boxes.set(link.group, box);
        }
        const a = document.createElement("a");
        a.className = "link";
        a.href = link.url;
        a.innerHTML = '<span class="key"></span><span></span><span class="group"></span>';
        a.children[1].textContent = link.name;
        a.lastChild.textContent = link.group;
        box.appendChild(a);
        items.push({ a: a, box: box, name: words(link.name), group: words(link.group) });
      }
      // screen order on an empty query: group by group, as the grid lays them out
      items.sort((x, y) => x.box.order - y.box.order);

      function asUrl(text) {
        const t = text.trim();
        if (t === "" || /\s/.test(t)) return null;
        if (/^(https?|file|ftp|about|qute|chrome|view-source|data):/i.test(t)) return t;
        if (/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/.*)?$/i.test(t)) return "http://" + t;
        if (/^[^\/:]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(t)) return "https://" + t;
        return null;
      }

      // every query word starts a word of the name or group, so a plain word with no such link falls through to search
      function score(query, it) {
        let s = 0;
        for (const token of query.split(/\s+/)) {
          const hit = (ws, bonus) => ws.reduce((best, w) => w.startsWith(token) ? Math.max(best, bonus + (w === token ? 2 : 1)) : best, -1);
          const best = Math.max(hit(it.name, 2), hit(it.group, 0));
          if (best < 0) return -1;
          s += best;
        }
        return s;
      }

      let shown = [];
      let sel = 0;

      function render() {
        const query = q.value.trim().toLowerCase();
        const url = asUrl(q.value);
        shown = [];
        for (const it of items) {
          const s = query === "" ? 0 : score(query, it);
          if (s >= 0) shown.push({ it: it, s: s });
        }
        // a query shows one flat ranked list, so the numbers and the arrow order follow the screen
        if (query === "") {
          for (const it of items) it.box.appendChild(it.a);
        } else {
          shown.sort((x, y) => y.s - x.s);
          matches.replaceChildren(...shown.map((m) => m.it.a));
        }
        groups.hidden = query !== "";
        matches.hidden = query === "";
        sel = Math.min(sel, Math.max(shown.length - 1, 0));
        items.forEach((it) => { it.a.classList.remove("sel"); it.a.firstChild.textContent = ""; });
        shown.slice(0, 9).forEach((m, i) => { m.it.a.firstChild.textContent = String(i + 1); });
        if (query !== "" && shown.length > 0 && !url) shown[sel].it.a.classList.add("sel");
        hint.textContent = url ? "enter: open url" : query === "" ? "type to filter, ctrl+1-9 open" : shown.length ? "enter: open, shift+enter: search" : "enter: search";
      }

      // a synthesized anchor click navigates the tab where scripted location.href is constrained (file:// new-tab context)
      function go(href) {
        const a = document.createElement("a");
        a.href = href;
        document.body.appendChild(a);
        a.click();
      }

      q.addEventListener("input", () => { sel = 0; render(); });
      q.addEventListener("paste", (e) => {
        const url = asUrl((e.clipboardData || window.clipboardData).getData("text"));
        if (url) { e.preventDefault(); go(url); }
      });
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && /^[1-9]$/.test(e.key)) {
          const m = shown[Number(e.key) - 1];
          if (m) { e.preventDefault(); go(m.it.a.href); }
          return;
        }
        if (e.key === "Escape") { q.value = ""; sel = 0; render(); return; }
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          if (shown.length === 0) return;
          e.preventDefault();
          sel = (sel + (e.key === "ArrowDown" ? 1 : shown.length - 1)) % shown.length;
          render();
          return;
        }
        if (e.key === "Enter") {
          const text = q.value;
          if (text.trim() === "") { e.preventDefault(); return; }
          const url = asUrl(text);
          if (url) { e.preventDefault(); go(url); return; }
          if (!e.shiftKey && shown.length > 0) { e.preventDefault(); go(shown[sel].it.a.href); return; }
          // a GET search navigates like a link; firefox drops a native submit from file://, so only POST falls through
          if (METHOD.toUpperCase() !== "POST") { e.preventDefault(); go(SEARCH.replace("{}", encodeURIComponent(text.trim()))); }
          return;
        }
        if (document.activeElement !== q && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) q.focus();
      });

      function tick() {
        const d = new Date();
        const two = (n) => String(n).padStart(2, "0");
        document.getElementById("clock").textContent =
          d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }).toLowerCase() + "  " + two(d.getHours()) + ":" + two(d.getMinutes());
      }
      tick();
      setInterval(tick, 15000);
      render();
      q.focus();
    </script>
  </body>
</html>
