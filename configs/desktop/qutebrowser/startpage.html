<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>home</title>
    <style>
      :root {
        --background: #07090d;
        --foreground: #bfbdb6;
        --muted: #565b66;
        --cell: #59c2ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* absolute url, firefox resolves relative to the symlink target; link.sh renders the home in */
        background:
          linear-gradient(rgba(7, 9, 13, 0.78), rgba(7, 9, 13, 0.78)),
          url("file://@HOME@/.cache/wal/wallpaper") center / cover no-repeat fixed;
        background-color: var(--background);
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
      }
      #clock {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        font-family: "Kode Mono", monospace;
        color: var(--foreground);
        text-align: center;
        user-select: none;
        pointer-events: none;
      }
      #time {
        font-size: 5.5rem;
        font-weight: 600;
        letter-spacing: 2px;
      }
      #date {
        font-size: 1.1rem;
        color: var(--muted);
        margin-top: 0.3rem;
      }
      #search {
        position: fixed;
        left: 50%;
        top: calc(50% + 8rem);
        transform: translateX(-50%);
        z-index: 3;
        width: min(38rem, 80vw);
        /* shown on first printable keypress */
        display: none;
      }
      #q {
        width: 100%;
        box-sizing: border-box;
        padding: 0.7rem 1rem;
        font-family: "Kode Mono", monospace;
        font-size: 1.1rem;
        color: var(--foreground);
        background: rgba(7, 9, 13, 0.72);
        border: 1px solid var(--cell);
        border-radius: 6px;
        outline: none;
        text-align: center;
      }
      #q::placeholder {
        color: var(--muted);
      }
      #links {
        position: fixed;
        left: 50%;
        bottom: 2.5rem;
        transform: translateX(-50%);
        z-index: 2;
        width: min(60rem, 90vw);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem 1.2rem;
        font-family: "Kode Mono", monospace;
        font-size: 0.95rem;
      }
      #links a {
        color: var(--foreground);
        text-decoration: none;
      }
      #links a:hover,
      #links a:focus,
      #links a.selected {
        color: var(--cell);
        outline: none;
      }
      #links a.selected {
        text-decoration: underline;
      }
    </style>
    <link rel="stylesheet" href="file://@HOME@/.cache/wal/colors-qutebrowser.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <form id="search" action="https://www.google.com/search" method="get">
      <input id="q" name="q" type="text" autocomplete="off"
             placeholder="search google" />
    </form>
    <nav id="links"></nav>
    <!-- generated from weblinks/links.txt by weblinks/link.py -->
    <script src="file://@DOTFILES@/weblinks/collection/links.js"></script>
    <script>
      "use strict";

      // digital rain, ported from the quickshell matrix lock
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");

      const style = getComputedStyle(document.documentElement);
      const head_color = style.getPropertyValue("--cell").trim();

      const cell_size = 18;
      const trail_fade = 0.12;
      const charset = "01<>[]{}/\\|=+-*!?$#@abcdef0123456789";

      function glyph() {
        return charset.charAt(Math.floor(Math.random() * charset.length));
      }

      let columns = 0;
      let rows = 0;
      let drops = [];
      let pixel_ratio = 1;

      function drop_create() {
        return {
          y: -Math.floor(Math.random() * rows),
          speed: 0.4 + Math.random() * 0.9,
        };
      }

      // tiling resizes the window all the time: running drops and their trails survive it, only new columns are added
      function resize() {
        const ratio = window.devicePixelRatio || 1;
        const snapshot = document.createElement("canvas");
        snapshot.width = canvas.width;
        snapshot.height = canvas.height;
        if (snapshot.width > 0 && snapshot.height > 0) {
          snapshot.getContext("2d").drawImage(canvas, 0, 0);
        }

        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (snapshot.width > 0 && snapshot.height > 0) {
          context.drawImage(snapshot, 0, 0, snapshot.width / pixel_ratio, snapshot.height / pixel_ratio);
        }
        pixel_ratio = ratio;

        columns = Math.ceil(window.innerWidth / cell_size);
        rows = Math.ceil(window.innerHeight / cell_size);

        drops.length = Math.min(drops.length, columns);
        while (drops.length < columns) {
          drops.push(drop_create());
        }
      }

      function draw() {
        // erase trails so the wallpaper shows through
        context.globalCompositeOperation = "destination-out";
        context.fillStyle = "rgba(0, 0, 0, " + trail_fade + ")";
        context.fillRect(0, 0, window.innerWidth, window.innerHeight);
        context.globalCompositeOperation = "source-over";

        context.fillStyle = head_color;
        context.font = cell_size + "px \"Kode Mono\", monospace";
        context.textBaseline = "top";

        for (let i = 0; i < drops.length; i++) {
          const row = Math.floor(drops[i].y);
          if (row >= 0 && row <= rows) {
            context.fillText(glyph(), i * cell_size, row * cell_size);
          }

          drops[i].y += drops[i].speed;
          if (drops[i].y - 16 > rows && Math.random() > 0.975) {
            drops[i].y = -Math.floor(Math.random() * 8);
            drops[i].speed = 0.4 + Math.random() * 0.9;
          }
        }
      }

      const step_interval = 80;
      let last_step = 0;

      function frame(now) {
        if (now - last_step >= step_interval) {
          draw();
          last_step = now;
        }
        requestAnimationFrame(frame);
      }

      function update_clock() {
        const now = new Date();
        const pad = function (number) {
          return String(number).padStart(2, "0");
        };

        document.getElementById("time").textContent =
          pad(now.getHours()) + ":" + pad(now.getMinutes());
        document.getElementById("date").textContent = now.toLocaleDateString(
          undefined,
          { weekday: "long", day: "numeric", month: "long" },
        );
      }

      // bookmarks; links.js is missing until weblinks/link.py ran once
      const links_nav = document.getElementById("links");
      const bookmarks = [];
      for (const link of typeof weblinks === "undefined" ? [] : weblinks) {
        const anchor = document.createElement("a");
        anchor.href = link.url;
        anchor.textContent = link.name;
        links_nav.appendChild(anchor);
        bookmarks.push({ anchor: anchor, text: (link.name + " " + link.url).toLowerCase() });
      }

      window.addEventListener("resize", resize);

      resize();
      requestAnimationFrame(frame);

      update_clock();
      setInterval(update_clock, 10000);

      // append the triggering char so it is not dropped
      const search_form = document.getElementById("search");
      const search_input = document.getElementById("q");

      function hide_search() {
        search_form.style.display = "none";
        search_input.value = "";
        for (const b of bookmarks) b.anchor.hidden = false;
      }

      // subsequence fuzzy score; higher means a tighter match, -1 if the query is not a subsequence
      function fuzzy_score(query, text) {
        let ti = 0;
        let score = 0;
        let streak = 0;
        for (let qi = 0; qi < query.length; qi++) {
          const found = text.indexOf(query[qi], ti);
          if (found === -1) return -1;
          streak = found === ti ? streak + 1 : 0;
          score += streak + (found === 0 ? 2 : 0);
          ti = found + 1;
        }
        return score;
      }

      let matches = [];
      let selected = -1;

      function render_matches() {
        for (const b of bookmarks) b.anchor.classList.remove("selected");
        if (selected >= 0 && selected < matches.length) {
          matches[selected].anchor.classList.add("selected");
          matches[selected].anchor.scrollIntoView({ block: "nearest" });
        }
      }

      function filter_bookmarks() {
        const query = search_input.value.trim().toLowerCase();
        matches = [];
        for (const b of bookmarks) {
          const score = query === "" ? 0 : fuzzy_score(query, b.text);
          b.anchor.hidden = query !== "" && score < 0;
          if (score >= 0) matches.push({ anchor: b.anchor, score: score });
        }
        if (query !== "") matches.sort((a, b) => b.score - a.score);
        selected = query !== "" && matches.length > 0 ? 0 : -1;
        render_matches();
      }

      document.addEventListener("keydown", function (event) {
        if (document.activeElement === search_input) return;
        if (event.ctrlKey || event.altKey || event.metaKey) return;
        if (event.key.length !== 1) return;
        event.preventDefault();
        search_form.style.display = "block";
        search_input.value += event.key;
        search_input.focus();
        filter_bookmarks();
      });

      search_input.addEventListener("input", filter_bookmarks);

      search_input.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          hide_search();
          filter_bookmarks();
          search_input.blur();
        } else if (event.key === "ArrowDown" && matches.length > 0) {
          event.preventDefault();
          selected = (selected + 1) % matches.length;
          render_matches();
        } else if (event.key === "ArrowUp" && matches.length > 0) {
          event.preventDefault();
          selected = (selected - 1 + matches.length) % matches.length;
          render_matches();
        } else if (event.key === "Enter" && selected >= 0) {
          // a matching bookmark wins; google stays the fallback when nothing matches
          event.preventDefault();
          window.location.href = matches[selected].anchor.href;
        }
      });

      search_input.addEventListener("blur", function () {
        if (search_input.value === "") {
          hide_search();
          filter_bookmarks();
        }
      });
    </script>
  </body>
</html>
