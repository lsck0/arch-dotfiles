# Route a tool through the single declared egress (scripts/egress.sh).
#   proxychains4 -f ~/.proxychains/proxychains.conf nmap -sT -Pn <target>
# nmap must be -sT (full connect): proxychains cannot carry raw SYN/UDP.

# One proxy, so strict vs dynamic is moot; strict fails loudly if it is down.
strict_chain

# Resolve names through the proxy. Without this a tool leaks a direct DNS query
# from the real host even while its TCP goes through the tunnel.
proxy_dns

tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
# Must match EGRESS_SOCKS_PORT in the egress config (default 9050).
socks5 127.0.0.1 9050
