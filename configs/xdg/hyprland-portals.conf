# Portal backend preference for the Hyprland session.
#
# Filename matters: xdg-desktop-portal looks for `<desktop>-portals.conf`
# where <desktop> comes from XDG_CURRENT_DESKTOP (here: Hyprland). This file
# overrides /usr/share/xdg-desktop-portal/hyprland-portals.conf, which ships
# `default=hyprland;gtk`.
#
# Why this file exists: five portal backends were installed at once (gnome,
# gtk, hyprland, kde, plus plasmanotify/gnome-keyring/kwallet helpers) with
# nothing pinning the choice. Backends compete to answer the same D-Bus
# interfaces, and the winner depended on startup order — the usual cause of
# "the file picker looks wrong" or "screen sharing doesn't work". Flatpak is
# installed with real apps here, so this is not theoretical: sandboxed apps
# reach the host *only* through portals.
#
# Note `kde.portal` declares `UseIn=KDE` and we run as Hyprland. That is fine:
# since xdg-desktop-portal 1.18, `portals.conf` supersedes the legacy `UseIn`
# key (this machine runs 1.22.1), so naming a backend here is enough to use
# it regardless of UseIn.

[preferred]
# hyprland first: it is the only backend that can actually see this
# compositor, and it owns Screenshot, ScreenCast, GlobalShortcuts and
# InputCapture. Everything it does not implement falls through to kde, which
# covers FileChooser, AppChooser, Print, Settings, Inhibit, Account, Email
# and the rest.
default=hyprland;kde

# Secret: neither hyprland nor kde implements it. gnome-keyring does
# (gnome-keyring.portal, owned by the gnome-keyring package — NOT by
# xdg-desktop-portal-gnome, so this survives removing the GNOME session).
# Its `UseIn=gnome` is why it needs naming explicitly here. Without this,
# Flatpak apps asking for stored secrets get nothing.
org.freedesktop.impl.portal.Secret=gnome-keyring

# Notification: kde.portal does not implement it and hyprland does not
# either, so a sandboxed app's portal notification would otherwise go
# unanswered. plasmanotify (from plasma-workspace) implements it and
# forwards to the session's notification service — which is quickshell's own
# daemon. Verify that a Flatpak notification actually renders in the
# quickshell style; if it does not, this line is the thing to revisit.
org.freedesktop.impl.portal.Notification=plasmanotify
