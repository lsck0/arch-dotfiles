[preferred]
default=hyprland;kde
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Notification=plasmanotify
# Pin screen capture to the hyprland backend so getDisplayMedia (browser screen
# share) opens the hyprland picker, not a kde/gtk backend that shows nothing.
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.ScreenShot=hyprland
