[Service]
# Run unprivileged (the shipped unit runs as root); DynamicUser gives a transient
# user, and the ambient cap lets it still bind port 22 (<1024).
DynamicUser=yes
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
# The shipped unit runs endlessh with no -f, so it ignores /etc/endlessh/config
# and uses the built-in default port 2222 (collides with real sshd). Point it at
# the config so it binds 22.
ExecStart=
ExecStart=/usr/bin/endlessh -f /etc/endlessh/config
