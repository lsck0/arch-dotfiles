general {
    lock_cmd = ~/.config/hypr/hyprlock-launch.sh
    before_sleep_cmd = loginctl lock-session                                                  # lock before suspend
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"                         # to avoid having to press a key twice to turn on the display
}

listener {
    timeout = 900                                                                             # 15min
    on-timeout = brightnessctl -s set 10                                                      # set monitor backlight to minimum, avoid 0 on OLED monitor
    on-resume = brightnessctl -r                                                              # monitor backlight restore
}

listener {
    timeout = 1200                                                                            # 20min
    on-timeout = quickshell ipc -p ~/.config/quickshell call matrixrain open                  # matrix-rain screensaver (replaces the hyprlock idle lock)
    on-resume = quickshell ipc -p ~/.config/quickshell call matrixrain close
    condition_cmd = ~/.config/hypr/idle-media-guard.sh                                        # never screensaver while media plays
    condition_retry = 60
}

listener {
    timeout = 1500                                                                            # 25min
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ mode = 'off' })"                             # screen off
    on-resume = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"                               # screen on
}

listener {
   timeout = 1800                                                                             # 30min
   on-timeout = systemctl suspend                                                             # suspend pc
   condition_cmd = ~/.config/hypr/idle-media-guard.sh && ~/.config/hypr/ssh-inhibit-guard.sh && ~/.config/hypr/claude-busy-guard.sh  # never suspend while media plays, someone's sshed in, or claude is working
   condition_retry = 60
}
