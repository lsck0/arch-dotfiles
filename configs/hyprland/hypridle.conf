general {
    # Locking is owned by hyprlock (configs/hyprland/hyprlock.conf), invoked
    # via hyprlock-launch.sh, which enables fingerprint auth only when this
    # user has a real fprintd device with an enrolled finger. Quickshell's own
    # lock plugin (plugins/lock/Lock.qml) was removed 2026-09-08 — it was
    # built and manually verified working but hyprlock does the job with no
    # extra security-critical QML surface to maintain.
    lock_cmd = ~/.config/hypr/hyprlock-launch.sh
    before_sleep_cmd = loginctl lock-session                            # lock before suspend
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"   # to avoid having to press a key twice to turn on the display
}

listener {
    timeout = 600                                                       # 10min
    on-timeout = brightnessctl -s set 10                                # set monitor backlight to minimum, avoid 0 on OLED monitor
    on-resume = brightnessctl -r                                        # monitor backlight restore
}

listener {
    timeout = 900                                                       # 15min
    on-timeout = loginctl lock-session                                  # lock screen
    condition_cmd = ~/.config/hypr/idle-media-guard.sh                  # never lock while media plays; locking while sshed in is fine
    condition_retry = 60
}

listener {
    timeout = 1200                                                      # 20min
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ mode = 'off' })"       # screen off
    on-resume = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"         # screen on
}

listener {
   timeout = 1800                                                       # 30min
   on-timeout = systemctl suspend                                       # suspend pc
   condition_cmd = ~/.config/hypr/idle-media-guard.sh && ~/.config/hypr/ssh-inhibit-guard.sh  # never suspend while media plays or someone's sshed in
   condition_retry = 60
}
