$FONT = 0xProto Nerd Font

# those get set by the change wallpaper script
$BACKGROUND = rgb(1,6,14)
$FOREGROUND = rgb(240,113,120)
$COLOR1 = rgb(170,217,76)
$COLOR2 = rgb(230,180,80)
$COLOR3 = rgb(57,186,230)
$BACKGROUND_GLASS = rgba(1,6,14,0.55)

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    disable_loading_bar = true
    grace = 0
}

auth {
    fingerprint:enabled = true
}

background {
    monitor =
    path = ~/.cache/wal/wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 1
    brightness = 0.8
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# DATE
label {
  monitor = 
  text = cmd[update:1000] echo "<span fgalpha='80%'>$(date +"%d/%m/%y")</span>"
  color = rgb(255, 255, 255)
  font_size = 32
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 5
  shadow_color = $FOREGROUND
  position = 0, 200
  text_align = center
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%H//%M//%S")"
  color = rgb(255, 255, 255)
  font_size = 110
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 5
  shadow_color = $FOREGROUND
  position = 0, 70
  text_align = center
  halign = center
  valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.5
    dots_center = true
    dots_text_format = <b>x</b>
    outer_color = $COLOR1 $COLOR2 $COLOR3 45deg
    inner_color = $BACKGROUND_GLASS
    font_color = $FOREGROUND
    font_family = $FONT
    font_size = 35
    fade_on_empty = true
    rounding = 14
    check_color = $COLOR3
    fail_color = $FOREGROUND
    placeholder_text =
    fail_text = <b><span>  Access Denied</span></b>
    capslock_color = $COLOR2
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# SYSTEM STATS
label {
  monitor =
  text = cmd[update:3000] ~/.config/hypr/lockscreen-stats.sh
  color = rgb(255, 255, 255)
  font_size = 14
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 3
  shadow_color = $FOREGROUND
  position = 30, 30
  text_align = left
  halign = left
  valign = bottom
}

# WEATHER
label {
  monitor =
  text = cmd[update:300000] ~/.config/hypr/lockscreen-weather.sh
  color = rgb(255, 255, 255)
  font_size = 14
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 3
  shadow_color = $FOREGROUND
  position = 0, 165
  text_align = center
  halign = center
  valign = center
}
