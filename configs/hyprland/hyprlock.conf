$FONT = 0xProto Nerd Font

# those get set by the change wallpaper script
$BACKGROUND = rgb(0,1,3)
$FOREGROUND = rgb(60,80,89)
$COLOR1 = rgb(116,116,152)
$COLOR2 = rgb(156,109,122)
$COLOR3 = rgb(45,126,153)
# Translucent twin of $BACKGROUND (same rgb triple, same wallpaper-driven
# update in scripts/switch-wallpaper.sh) — for surfaces that should read as
# frosted glass over the blurred background rather than a flat opaque box.
$BACKGROUND_GLASS = rgba(0,1,3,0.55)

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    disable_loading_bar = true
    grace = 0
}

auth {
    fingerprint:enabled = true
}

background {
    monitor =
    path = ~/.cache/wal/wallpaper
    # blur_size was 3 (well under hyprlock's default of 7) and noise was
    # 0.05 (~4x hyprlock's default 0.0117) — a small blur kernel plus heavy
    # noise on a 1920x1080 source read as grainy/blocky. Larger kernel +
    # default-ish noise gives a smooth frosted-glass look instead.
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 1
    brightness = 0.8
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# DATE — small, centered, directly above the time (no more overlap: it used
# to be a right-aligned label offset diagonally from the time, which visually
# collided with the "23" of the time. font_size is intentionally much
# smaller than TIME so it reads as a subtitle, not a second headline).
label {
  monitor = 
  text = cmd[update:1000] echo "<span fgalpha='80%'>$(date +"%d/%m/%y")</span>"
  color = rgb(255, 255, 255)
  font_size = 32
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 5
  shadow_color = $FOREGROUND
  position = 0, 200
  text_align = center
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%H//%M//%S")"
  color = rgb(255, 255, 255)
  font_size = 110
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 5
  shadow_color = $FOREGROUND
  position = 0, 70
  text_align = center
  halign = center
  valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.5
    dots_center = true
    dots_text_format = <b>x</b>
    outer_color = $COLOR1 $COLOR2 $COLOR3 45deg
    # Was flat $BACKGROUND (opaque black box, clashing with the frosted-glass
    # background below it). $BACKGROUND_GLASS reads as part of the blurred
    # backdrop instead of a solid panel sitting on top of it.
    inner_color = $BACKGROUND_GLASS
    font_color = $FOREGROUND
    font_family = $FONT
    font_size = 35
    fade_on_empty = true
    rounding = 14
    check_color = $COLOR3
    # Was a hardcoded rgb(242,135,121) close to but not $FOREGROUND — now the
    # same wallpaper-derived accent everything else on this screen uses.
    fail_color = $FOREGROUND
    placeholder_text =
    fail_text = <b><span>  Access Denied</span></b>
    # Was a hardcoded rgb(255,213,128) unrelated to the palette; $COLOR2 is
    # the theme's amber/gold swatch already used for the outline gradient.
    capslock_color = $COLOR2
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# SYSTEM STATS — cpu load / mem usage / uptime / kernel, bottom-left corner.
# Pulled from lockscreen-stats.sh, next to this config (local /proc + free +
# uname only, no network, so a 3s poll never risks hanging the lock screen).
label {
  monitor =
  text = cmd[update:3000] ~/.config/hypr/lockscreen-stats.sh
  color = rgb(255, 255, 255)
  font_size = 14
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 3
  shadow_color = $FOREGROUND
  position = 30, 30
  text_align = left
  halign = left
  valign = bottom
}

# WEATHER — current conditions, stacked directly under the date/time block,
# centered like them (was bottom-right corner; moved to sit under the date).
# Reads the already location-sanitised cache the bar widget writes
# (lockscreen-weather.sh never talks to Open-Meteo itself) — polled every 5
# minutes since the underlying data only refreshes every 30 anyway. Renders
# nothing if the bar widget has never run yet (no cache), same graceful-omit
# rule it follows.
label {
  monitor =
  text = cmd[update:300000] ~/.config/hypr/lockscreen-weather.sh
  color = rgb(255, 255, 255)
  font_size = 14
  font_family = $FONT
  shadow_passes = 2
  shadow_size = 3
  shadow_color = $FOREGROUND
  position = 0, 165
  text_align = center
  halign = center
  valign = center
}
