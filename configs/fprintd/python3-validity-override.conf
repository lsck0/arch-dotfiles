# vendor unit ships Restart=no
[Unit]
# systemd defaults to 5 starts per 10s, which RestartSec=2 burns through immediately: a sensor that is not
# ready yet right after usb enumeration gets re-powered five times back to back (the led blinking for a few
# seconds at boot) and the unit still ends up failed. Retry slowly and for long enough to actually recover.
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=always
RestartSec=15
