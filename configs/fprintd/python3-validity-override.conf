# vendor unit ships Restart=no
[Unit]
# systemd's default 5 starts per 10s with RestartSec=2 re-powers a not-yet-ready sensor five times back to back right after usb enumeration (led blinks, unit ends failed); retry slowly and long enough to recover
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=always
RestartSec=15
