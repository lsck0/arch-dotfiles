# Tune memory reclaim for swap-on-zram, which is RAM-speed and CPU-bound
# (compression), unlike the disk-swap assumptions baked into the kernel defaults.

# >100 tells the kernel evicting an anonymous page is cheaper than dropping a
# page-cache page it would have to re-read from disk. True for zram, false for
# disk. Not unbounded: every swapped page still costs a compress + decompress.
vm.swappiness = 150

# Halve the eagerness to drop dentry/inode cache, which can't spill to zram
# and is costly to rebuild. Not lower: 0 risks OOM under cache pressure.
vm.vfs_cache_pressure = 50

# Read one page per swap-in fault instead of 8. The default pays for a disk
# seek zram doesn't have, and every extra page is a wasted decompression.
vm.page-cluster = 0

# Don't let fragmentation raise reclaim watermarks and cause reclaim bursts
# while memory is still free.
vm.watermark_boost_factor = 0

# Keep ~1.25% of memory free instead of 0.1%, so kswapd reclaims in the
# background instead of allocations stalling in direct reclaim.
vm.watermark_scale_factor = 125

# Cap dirty pages at 64M/256M instead of the default ~10%/20% of RAM, which
# lets gigabytes of writeback queue up and then flush in stalling bursts.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# With writeback bursts bounded above, the flusher can wake every 15s
# instead of every 5s.
vm.dirty_writeback_centisecs = 1500
