# tlp.conf without a battery: only what differs from tlp's defaults (/usr/share/tlp/defaults.conf), docs: https://linrunner.de/tlp/settings
# always on ac, so auto runs the ac profile; the power mode toggle's balanced and power-saver keep tlp's defaults

# gaming and streaming box: full clocks over idle watts
CPU_ENERGY_PERF_POLICY_ON_AC=performance
