add_newline = true
command_timeout = 3000
scan_timeout = 100

format = """
$directory$git_branch$git_status$git_metrics$rust$python$nodejs$golang$lua$nix_shell$cmd_duration$jobs$status
$character"""

[container]
disabled = true

[character]
success_symbol = '[λ](bold green)'
error_symbol = '[λ](bold red)'

[directory]
style = 'bold blue'
read_only = ' '
read_only_style = 'bold red'
truncation_symbol = '.../'
format = '[\[](bold blue)[$path]($style)[$read_only]($read_only_style)[\]](bold blue) '

[git_branch]
symbol = ' '
style = 'bold blue'
format = '[$symbol$branch]($style) '

[sudo]
disabled = true
style = 'bold green'
symbol = 'su '

[git_metrics]
disabled = true
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[nix_shell]
symbol = "󰜗 "

[aws]
disabled = true

[git_status]
disabled = false
style = 'bold red'
# presence only, counts would spam on dirty repos
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '='
untracked = '?'
stashed = '\$'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[cmd_duration]
min_time = 500
style = 'bold yellow'
format = '[${duration}]($style) '

[status]
disabled = false
style = 'bold red'
symbol = '[x](bold red) '
format = '[$symbol$status]($style) '

[jobs]
symbol = '&'
style = 'bold blue'
format = '[$symbol$number]($style) '

[rust]
symbol = ' '
style = 'bold red'
format = '[$symbol($version)]($style) '

[python]
symbol = ' '
style = 'bold yellow'
format = '[$symbol($version)]($style) '

[nodejs]
symbol = ' '
style = 'bold green'
format = '[$symbol($version)]($style) '

[golang]
symbol = ' '
style = 'bold cyan'
format = '[$symbol($version)]($style) '

[lua]
symbol = ' '
style = 'bold blue'
format = '[$symbol($version)]($style) '

[package]
disabled = true
