onboarding = false

[theme]
# BEGIN PYWAL THEME
[theme.custom]
sidebar_bg = "reset"
panel_bg = "reset"
active_row_bg = "#1d2d34"
selection_bg = "#26343c"
accent = "#8E7982"
red = "#847E89"
green = "#5F8496"
surface_dim = "#122329"
surface0 = "#203037"
surface1 = "#2b3942"
overlay0 = "#3a4650"
overlay1 = "#505964"
text = "#C7C2D8"
subtext0 = "#888a9b"
yellow = "#9E7782"
blue = "#8E7982"
mauve = "#6D84A3"
teal = "#827E92"
peach = "#9E7782"
# END PYWAL THEME

[ui]
sidebar_width = 20
sidebar_min_width = 14
sidebar_max_width = 30
agent_panel_sort = "spaces"
prompt_new_tab_name = false
pane_outer_borders = false
# wheel/keys still scroll
pane_scrollbars = false

[keys]
prefix = "ctrl+q"
split_horizontal = "prefix+s"     # tmux: bind s split-window -v (stacked)
split_vertical = "prefix+v"       # tmux: bind v split-window -h (side by side)
edit_scrollback = "prefix+e"      # tmux: bind e copy-mode (scrollback/copy)
settings = ""                     # cleared: prefix+s is split_horizontal, not settings
toggle_sidebar = ""               # cleared: prefix+b is the wtree popup, not sidebar
close_pane = "prefix+q"
close_tab = "prefix+x"
detach = ""
# tmux: alt+shift+hjkl select-pane, plain alt+hjkl stays with nvim
focus_pane_left = "alt+shift+h"
focus_pane_down = "alt+shift+j"
focus_pane_up = "alt+shift+k"
focus_pane_right = "alt+shift+l"
workspace_picker = ""             # tmux: bind w -> sessionizer popup, not workspace picker
goto = ""                         # tmux: bind g -> gh-dash popup, not goto
next_tab = ""                     # tmux: bind n -> netscanner popup, not next-window
previous_tab = ""                 # tmux: bind p -> btop popup, not previous-window
zoom = ""                         # tmux: bind z -> zsh popup, not pane zoom
new_workspace = ""
next_workspace = "prefix+]"
previous_workspace = "prefix+["
next_agent = "alt+n"
previous_agent = "alt+p"

[[keys.command]]
key = "prefix+w"
type = "popup"
command = "hms"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "pclone"
