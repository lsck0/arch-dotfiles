onboarding = false
# herdr config, mirroring configs/tmux/tmux.conf's actual bindings 1:1 so
# muscle memory carries over. Where a tmux binding repurposes a key away from
# tmux's own built-in default (g, j, k, n, p, w, z all do this in tmux.conf),
# the same herdr built-in default on that key is cleared here so the popup
# command wins instead of colliding with it.

[theme]
# name left on herdr's default base theme; only tokens below are overridden.
# Begin/End markers must match generate-editor-themes.sh's awk block (it replaces
# everything between them on every wal/wallust run, so any hand edit inside them
# is lost — consistent with "do not hand-edit").
# BEGIN PYWAL THEME (generated by configs/wallust/scripts/generate-editor-themes.sh — do not hand-edit)
[theme.custom]
sidebar_bg = "reset"
panel_bg = "reset"
active_row_bg = "#202731"
selection_bg = "#292f39"
accent = "#39BAE6"
red = "#F07178"
green = "#AAD94C"
surface_dim = "#161d29"
surface0 = "#242a34"
surface1 = "#2e333d"
overlay0 = "#3b4048"
overlay1 = "#4f5359"
text = "#BFBDB6"
subtext0 = "#848585"
yellow = "#E6B450"
blue = "#39BAE6"
mauve = "#D2A6FF"
teal = "#95E6CB"
peach = "#E6B450"
# END PYWAL THEME

# Issue 21 (v3): v1 (ghostty-composited) was too light and mismatched the
# opaque pane; v2 hardcoded near-black (#07090c), darker than $bg's own HSV
# floor — came back as "TOOOOO DARK". v3: herdr gets its own HSV floor
# (0.16, distinctly lighter than the shared $bg floor of 0.08 that Zed/
# VSCodium still use) instead of reusing $bg verbatim, and the blend ramp is
# restored closer to the original Catppuccin-style fractions so active/
# selection/surface states stay legible rather than "barely there hints".
# configs/wallust/scripts/generate-editor-themes.sh computes both the floor and the ramp;
# these values match what it emits for the current ayu-dark palette.
#
[ui]
# Left sidebar (workspace list) — smaller by default than herdr's stock 26/18/36.
sidebar_width = 20
sidebar_min_width = 14
sidebar_max_width = 30

# Carried over from the un-linked live config when configs/herdr/link.sh was
# finally run (2026-09-04). It existed only in ~/.config/herdr/config.toml,
# which had never been replaced by the symlink, so linking would have silently
# dropped it.
agent_panel_sort = "spaces"

# Issue 8: tmux UX parity. New tab must open immediately (no name prompt) —
# tmux's new-window never asks for a name; herdr prompts by default
# (prompt_new_tab_name = true in --default-config). Explicit false, not
# commented-out, so a future default change can't silently bring the popup back.
prompt_new_tab_name = false

# Same parity pass: tmux draws only internal splitters (no outer frame), herdr
# defaults both pane_borders and pane_outer_borders on. Outer frame off matches
# tmux; pane_borders left on so splits stay visible.
pane_outer_borders = false

[keys]
prefix = "ctrl+q"

# v: split_vertical already defaults to prefix+v and already means a
# side-by-side split (same as tmux's `split-window -h`) — no change needed.
split_horizontal = "prefix+s" # tmux: bind s split-window -v (stacked)

# tmux: bind q kill-pane / bind x kill-window. herdr's own defaults have
# these reversed (q=detach, x=close_pane), so swap both.
close_pane = "prefix+q"
close_tab = "prefix+x"
# tmux.conf overrides its own default detach key (d) for the lazydocker
# popup below and never rebinds detach elsewhere, so there's no tmux
# muscle-memory key to preserve here — leaving it unset rather than
# inventing one that doesn't exist in tmux.
detach = ""

# Pane navigation on prefix+arrows (leader+arrow keys). Alphabetic alt+hjkl
# and prefix+hjkl were both too awkward/competed with popup commands, so
# arrows it is. Validated against herdr 0.8.2's --default-config schema:
# focus_pane_* is the only pane-focus action family (no *_arrow variants).
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# e: edit_scrollback already defaults to prefix+e, matching tmux's `bind e
# copy-mode` closely enough (both open scrollback review) — no change needed.

# c: new_tab already defaults to prefix+c. tmux.conf has no `bind c`
# override (that was tried at one point for a claude popup but never
# landed), so c is free in both — no change needed, matches tmux.
# Clear built-ins that would otherwise collide with the popup commands below,
# on keys tmux.conf repurposes away from tmux's own defaults for the same keys.
workspace_picker = "" # tmux: bind w -> tmux-sessionizer popup, not workspace picker
goto = ""             # tmux: bind g -> lazygit popup, not goto
next_tab = ""         # tmux: bind n -> netscanner popup, not next-window
previous_tab = ""     # tmux: bind p -> btop popup, not previous-window
zoom = ""             # tmux: bind z -> zsh popup, not pane zoom
# shift+n: herdr's own new_workspace default is prefix+shift+n, same exact
# key tmux.conf's `bind N` (-> rustnet popup below) uses — same collision
# class as the others above, just missed in the first pass. No replacement
# binding needed: hms (prefix+w below) already creates-or-focuses
# a workspace by project, which covers what new_workspace would have done.
new_workspace = ""

# herdr ships these fully unbound (verified against herdr.dev's
# config-reference.json for this version) — bound here since spaces/agents
# had no keyboard nav at all otherwise. Not live-tested yet, same as
# everything else in this file per the herdr TODO.md item.
next_workspace = "prefix+]"
previous_workspace = "prefix+["
# Alt = direct nav without prefix, matching this file's existing alt+hjkl
# pane-focus convention above (no tmux equivalent for agents, herdr-native).
next_agent = "alt+n"
previous_agent = "alt+p"

# Popup commands, matching tmux.conf's `display-popup -h 90% -w 90% -E "..."`
# bindings exactly (same key, same command, same size).
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "hms"
width = "90%"
height = "90%"

