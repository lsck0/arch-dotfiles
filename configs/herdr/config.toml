onboarding = false

[theme]
# BEGIN PYWAL THEME
[theme.custom]
sidebar_bg = "reset"
panel_bg = "reset"
active_row_bg = "#272c32"
selection_bg = "#2e333a"
accent = "#61AFEF"
red = "#E06C75"
green = "#98C379"
surface_dim = "#1f2329"
surface0 = "#2a2e35"
surface1 = "#33373e"
overlay0 = "#3e424a"
overlay1 = "#4f545c"
text = "#ABB2BF"
subtext0 = "#7a808a"
yellow = "#D19A66"
blue = "#61AFEF"
mauve = "#C678DD"
teal = "#56B6C2"
peach = "#D19A66"
# END PYWAL THEME

[ui]
sidebar_width = 20
sidebar_min_width = 14
sidebar_max_width = 30
agent_panel_sort = "spaces"
prompt_new_tab_name = false
pane_outer_borders = false

[keys]
prefix = "ctrl+q"
split_horizontal = "prefix+s"     # tmux: bind s split-window -v (stacked)
close_pane = "prefix+q"
close_tab = "prefix+x"
detach = ""
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
workspace_picker = ""             # tmux: bind w -> sessionizer popup, not workspace picker
goto = ""                         # tmux: bind g -> lazygit popup, not goto
next_tab = ""                     # tmux: bind n -> netscanner popup, not next-window
previous_tab = ""                 # tmux: bind p -> btop popup, not previous-window
zoom = ""                         # tmux: bind z -> zsh popup, not pane zoom
new_workspace = ""
next_workspace = "prefix+]"
previous_workspace = "prefix+["
next_agent = "alt+n"
previous_agent = "alt+p"

[[keys.command]]
key = "prefix+w"
type = "popup"
command = "hms"
width = "90%"
height = "90%"

