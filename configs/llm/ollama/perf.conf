[Service]
# flash attention and a q8 kv cache halve the context's vram, leaving more layers on the gpu
Environment=OLLAMA_FLASH_ATTENTION=1
Environment=OLLAMA_KV_CACHE_TYPE=q8_0
# vram ollama leaves free per gpu, 512 MiB: filled to the brim, Hyprland and the shell stutter while a model runs
Environment=OLLAMA_GPU_OVERHEAD=536870912
