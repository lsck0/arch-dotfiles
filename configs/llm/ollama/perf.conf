[Service]
# flash attention and a q8 kv cache halve the context's vram, leaving more layers on the gpu
Environment=OLLAMA_FLASH_ATTENTION=1
Environment=OLLAMA_KV_CACHE_TYPE=q8_0
# vram ollama leaves free per gpu (option vram_percent): filled to the brim, Hyprland and the shell stutter while a
# model runs; what does not fit runs on the cpu
Environment=OLLAMA_GPU_OVERHEAD=@GPU_OVERHEAD@
