[Service]
# privacy: no usage phone-home from ollama or the HF downloader
Environment=OLLAMA_NOHISTORY=1
Environment=DO_NOT_TRACK=1
Environment=HF_HUB_DISABLE_TELEMETRY=1
# sandboxing on top of the packaged unit (ollama already runs as its own user). No PrivateDevices/SystemCallFilter:
# the GPU (/dev/kfd, /dev/dri) and ROCm ioctls must keep working.
NoNewPrivileges=yes
ProtectHome=read-only
ProtectKernelTunables=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
