[Coredump]
# cores for gdb and pwntools; they can hold secrets from memory, so capped and kept a week (coredump-tmpfiles.conf)
Storage=external
MaxUse=256M
# a crashing browser, game or vllm engine is not read and zstd-compressed in full only for MaxUse to delete it; 1G still
# holds any gdb or pwntools target
ProcessSizeMax=1G
ExternalSizeMax=1G
