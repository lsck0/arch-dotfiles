[Unit]
StartLimitIntervalSec=30
StartLimitBurst=6

[Service]
# the synaptics reader re-enumerates a moment after resume; resume.py races it and dies with USBError [Errno 19].
# wait for the device, then retry a few times until it is back
ExecStartPre=/usr/bin/sleep 2
Restart=on-failure
RestartSec=2
