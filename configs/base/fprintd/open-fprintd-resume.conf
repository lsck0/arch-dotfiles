[Unit]
StartLimitIntervalSec=30
StartLimitBurst=6

[Service]
# the synaptics reader is re-enumerated on resume (usb disconnect, new device number), so python3-validity holds a dead
# handle and resume.py's resume through it fails with USBError [Errno 19] however often it retries. a restart reopens
# the new device and registers it with open-fprintd again; wait for it to come back first, retry if it is still late
ExecStart=
ExecStart=/usr/bin/systemctl restart python3-validity.service
ExecStartPre=/usr/bin/sleep 2
Restart=on-failure
RestartSec=2
