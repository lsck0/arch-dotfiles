[Unit]
StartLimitIntervalSec=30
StartLimitBurst=6

[Service]
# the reader re-enumerates on resume, resume.py's dead handle fails with USBError 19; a restart reopens it
ExecStart=
ExecStart=/usr/bin/systemctl restart python3-validity.service
ExecStartPre=/usr/bin/sleep 2
Restart=on-failure
RestartSec=2
