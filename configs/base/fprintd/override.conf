[Unit]
# the default limit re-powers a not-yet-ready sensor five times right after enumeration and ends failed
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
# the package runs it with --debug: hex dumps of the encrypted sensor exchange and the matched finger in the journal
ExecStart=
ExecStart=/usr/lib/python-validity/dbus-service
Restart=always
RestartSec=15
