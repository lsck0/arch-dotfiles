# KEY=value, no quoting, ${HOME} the only var: the systemd generator and zshenv both read it

# dotnet / nuget / omnisharp
DOTNET_CLI_HOME=${HOME}/.local/share/dotnet
OMNISHARPHOME=${HOME}/.config/omnisharp

# python: ipython and jupyter
IPYTHONDIR=${HOME}/.config/ipython
JUPYTER_CONFIG_DIR=${HOME}/.config/jupyter
JUPYTER_PLATFORM_DIRS=1

# gnu parallel
PARALLEL_HOME=${HOME}/.config/parallel

# w3m
W3M_DIR=${HOME}/.local/state/w3m

# sagemath
DOT_SAGE=${HOME}/.local/share/sage

# minikube: appends .minikube to any path not already ending in it, so its state is minikube/.minikube
MINIKUBE_HOME=${HOME}/.local/share/minikube

# npm: cache only, userconfig and auth stay with the identity module
npm_config_cache=${HOME}/.cache/npm

# texlive: kpathsea's per-user var (luaotfload's font database, format files) and config trees, else ~/.texlive
TEXMFVAR=${HOME}/.cache/texlive/texmf-var
TEXMFCONFIG=${HOME}/.config/texlive/texmf-config

# android: the sdk sdkmanager manages, its user state (adb keys, emulator, avds) out of ~/.android; programming/android
ANDROID_HOME=${HOME}/.local/share/android-sdk
ANDROID_SDK_ROOT=${HOME}/.local/share/android-sdk
ANDROID_USER_HOME=${HOME}/.local/share/android
ANDROID_EMULATOR_HOME=${HOME}/.local/share/android
ANDROID_AVD_HOME=${HOME}/.local/share/android/avd
ANDROID_NDK_HOME=/opt/android-ndk
