# App-home env vars that keep $HOME clean: each program here would otherwise litter ~/.<name>, but reads a var
# that points it under the XDG base dirs instead. systemd's user manager and uwsm read this for every unit and
# graphical app; zshenv sources it for tty, ssh and the non-interactive shells agents run (configs/core/zsh/zshenv).
# KEY=value only, no quoting: both the systemd generator and the shell source read it. ${HOME} is the one var both
# expand, so paths are spelled out rather than built from ${XDG_*} (which a bare shell may not have yet); the
# locations still match the base dirs pam_env sets in configs/base/xdg/system.sh.
#
# CONVENTION: a new program that would create ~/.<name> gets its line here in the same change that adds the
# program, grouped and commented by app, sorted within a group. State and runtime junk -> .local/state, real data
# -> .local/share, config -> .config, caches -> .cache. A program with no such var is relocated by a symlink in
# configs/base/xdg/link.sh instead. See AGENTS.md (Conventions).

# dotnet / nuget / omnisharp
DOTNET_CLI_HOME=${HOME}/.local/share/dotnet
OMNISHARPHOME=${HOME}/.config/omnisharp

# python: ipython and jupyter
IPYTHONDIR=${HOME}/.config/ipython
JUPYTER_CONFIG_DIR=${HOME}/.config/jupyter
JUPYTER_PLATFORM_DIRS=1

# gnu parallel
PARALLEL_HOME=${HOME}/.config/parallel

# w3m
W3M_DIR=${HOME}/.local/state/w3m

# sagemath
DOT_SAGE=${HOME}/.local/share/sage

# minikube
MINIKUBE_HOME=${HOME}/.local/share/minikube

# npm: cache only (userconfig and auth stay with the identity module); set here so new invocations never make ~/.npm
npm_config_cache=${HOME}/.cache/npm
