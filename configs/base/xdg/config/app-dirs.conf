DOTNET_CLI_HOME=${HOME}/.local/share/dotnet
OMNISHARPHOME=${HOME}/.config/omnisharp

IPYTHONDIR=${HOME}/.config/ipython
JUPYTER_CONFIG_DIR=${HOME}/.config/jupyter
JUPYTER_PLATFORM_DIRS=1

PARALLEL_HOME=${HOME}/.config/parallel

W3M_DIR=${HOME}/.local/state/w3m

DOT_SAGE=${HOME}/.local/share/sage

MINIKUBE_HOME=${HOME}/.local/share/minikube

npm_config_cache=${XDG_CACHE_HOME:-${HOME}/.cache}/npm

TEXMFVAR=${XDG_CACHE_HOME:-${HOME}/.cache}/texlive/texmf-var
TEXMFCONFIG=${HOME}/.config/texlive/texmf-config

ANDROID_HOME=${HOME}/.local/share/android-sdk
ANDROID_SDK_ROOT=${HOME}/.local/share/android-sdk
ANDROID_USER_HOME=${HOME}/.local/share/android
ANDROID_EMULATOR_HOME=${HOME}/.local/share/android
ANDROID_AVD_HOME=${HOME}/.local/share/android/avd
ANDROID_NDK_HOME=/opt/android-ndk

# flux-rs reads FLUX_SYSROOT to find its sysroot data instead of defaulting to ~/.flux
FLUX_SYSROOT=/usr/lib/flux

# libpq reads PGPASSFILE for the password file, kept out of $HOME's default ~/.pgpass
PGPASSFILE=${HOME}/.local/share/pgpass

# ansible-core 2.14+ keeps collections, galaxy cache and control sockets under ANSIBLE_HOME instead of ~/.ansible
ANSIBLE_HOME=${HOME}/.local/share/ansible

# go workspace out of $HOME's default ~/go, single-sourced here instead of each shell rc
GOPATH=${HOME}/.local/share/go

# gtk2 (hexchat) reads its rc from GTK2_RC_FILES instead of ~/.gtkrc-2.0; desktop/gtk writes it
GTK2_RC_FILES=${HOME}/.config/gtk-2.0/gtkrc
