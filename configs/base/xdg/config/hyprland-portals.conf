[preferred]
default=hyprland;kde
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Notification=gtk
# kde's folder picker (6.8.2) spins and grows past 30 GB without drawing, freezing the asking app
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
# idle inhibit reaches hypridle through gtk's backend; kde's calls PowerDevil, which is not running here, and
# answers success while nothing is held. gtk's fails a request with any flag beyond idle (suspend, logout) outright,
# idle included: sleep while streaming or playing is held by desktop/idle-guards instead
org.freedesktop.impl.portal.Inhibit=gtk
# no backend on Hyprland serves these: kde registers none of them outside Plasma, so apps get no answer instead of a
# clean "unsupported"
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.Wallpaper=none
# nothing serves Background either: flatpaks get a clean "unsupported" for autostart and background requests
org.freedesktop.impl.portal.Background=none
