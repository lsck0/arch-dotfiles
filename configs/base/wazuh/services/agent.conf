[Service]
# the daemons run as the wazuh group and read both; a fresh install writes them root:root and starts the agent before
# the module's own chown would run, so the ownership is the unit's, set before every start
ExecStartPre=+/usr/bin/chown root:wazuh /var/ossec/etc/authd.pass /var/ossec/etc/ossec.conf
# the first start enrolls with the manager and waits for its answer, longer than the shipped 45 s on a fresh install
TimeoutStartSec=5min
