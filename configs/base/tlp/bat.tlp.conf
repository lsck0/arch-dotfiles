# only what differs from tlp's defaults (/usr/share/tlp/defaults.conf)

# set on ac too: tlp only writes configured values and would keep the battery cap
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=90

PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# tlp gives sav its own default instead of falling back to bat
PCIE_ASPM_ON_BAT=powersave
PCIE_ASPM_ON_SAV=powersave

# synaptics fingerprint reader; autosuspend hung lock-screen auth
USB_DENYLIST="06cb:009a"

# rendered from mod.nu's charge_start and charge_stop
START_CHARGE_THRESH_BAT0=@START@
STOP_CHARGE_THRESH_BAT0=@STOP@
