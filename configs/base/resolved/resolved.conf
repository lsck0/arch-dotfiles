[Resolve]
# Quad9 over TLS for everything not handled by a per-link resolver. NetworkManager and wg-quick hand their
# pushed DNS (incl. homelab domains like search.lsck0.dev) to resolved as per-link servers with routing domains,
# so those names resolve against the homelab/VPN resolver and everything else goes to Quad9 encrypted.
DNS=9.9.9.9#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=149.112.112.112#dns.quad9.net 2620:fe::9#dns.quad9.net
# opportunistic, not strict: strict applies to every server, the dhcp one included, which never speaks tls. while
# portmaster runs it turns this off (portmaster/dns.conf): it blocks other processes' tls dns as a bypass, plain port 53
# is what it intercepts and resolves over its own dot. off home fw-egress keeps dns on the tunnel either way
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
# global default route for names no per-link domain claims; the persona dispatcher takes protonvpn's ~. off proton0,
# so Quad9 stays the one upstream, through the tunnel
Domains=~.
# no single-label lookups broadcast onto whatever lan this is; avahi answers .local, at home only
LLMNR=no
MulticastDNS=no
