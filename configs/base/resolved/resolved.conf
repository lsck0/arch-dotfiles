[Resolve]
DNS=9.9.9.9#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=149.112.112.112#dns.quad9.net 2620:fe::9#dns.quad9.net
# not strict: strict also applies to the dhcp server, which never speaks tls
DNSOverTLS=opportunistic
# no: resolved's upstream queries are portmaster's, whose answers never carry signatures. allow-downgrade only works
# when resolved first probes through portmaster; a probe that reaches quad9 before it intercepts marks the server
# supported, then every unsigned answer fails "DNSSEC validation failed: no-signature" and nothing resolves
DNSSEC=no
# default route for unclaimed names; the persona dispatcher takes protonvpn's ~. so quad9 stays the one upstream
Domains=~.
# no single-label lookups broadcast onto a foreign lan; avahi answers .local
LLMNR=no
MulticastDNS=no
