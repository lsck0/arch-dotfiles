# on top of arch's defaults, which already set unprivileged_bpf_disabled=2, dmesg_restrict=1, sysrq=16 and loose rp_filter
# 1 hides kernel pointers from unprivileged users; 2 also blinds root's perf and bpftrace and buys nothing while lockdown is off
kernel.kptr_restrict = 1
# ptrace_scope stays at the kernel's 1: 2 ignores PR_SET_PTRACER, which pwntools gdb.attach relies on
kernel.kexec_load_disabled = 1
net.core.bpf_jit_harden = 2
fs.protected_fifos = 2
fs.protected_regular = 2
# root still loads line disciplines, unprivileged sockets can no longer pull in n_hdlc and friends
dev.tty.ldisc_autoload = 0
# compat bits stay at 8, 32-bit wine processes are short on address space
vm.mmap_rnd_bits = 32
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.tcp_rfc1337 = 1
# --- added by hardening pass: safe additions on top of the above ---
# no suid core dumps (they can leak secrets from privileged processes)
fs.suid_dumpable = 0
# refuse to follow links into dirs you don't own, in world-writable sticky dirs (symlink/hardlink TOCTOU)
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
# don't answer broadcast pings (smurf amplification)
net.ipv4.icmp_echo_ignore_broadcasts = 1
