# makepkg's default is `sudo -k`, which drops dot install's warm credential and re-prompts mid-install
PACMAN_AUTH=(sudo)

# makepkg leaves MAKEFLAGS unset, so an AUR build runs make single-threaded; -j over every thread cuts build time on
# the 9950x3d (32t) and notebook alike. a yay build sits in app.slice (cpu.weight 100) below the desktop's session.slice
# (400), so it never costs interactivity; 64G ram covers the -j32 peak
MAKEFLAGS="-j$(nproc)"
