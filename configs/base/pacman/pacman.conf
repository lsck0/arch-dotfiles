[options]
HoldPkg      = pacman glibc
CleanMethod = KeepInstalled
Architecture = auto

Color
ILoveCandy
CheckSpace
ParallelDownloads = 10

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# first, so its snapshot versions win over core and extra
[lsck0]
SigLevel = Required
# https only, so a hostile network cannot replay an older signed snapshot
Server = https://mirror.lsck0.dev/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
