[options]
HoldPkg      = pacman glibc
CleanMethod = KeepInstalled
Architecture = auto

Color
ILoveCandy
CheckSpace
ParallelDownloads = 10
NoExtract = boot/ boot/*-ucode.img
# the session bus logs every d-bus name two service files claim: dolphin is the file manager, not nemo; ksplashrc
# starts no splash, so the stock KSplash activation would wait a minute for nothing, and without one fails at once
NoExtract = usr/share/dbus-1/services/nemo.FileManager1.service usr/share/dbus-1/services/org.kde.KSplash.service
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[lsck0]
SigLevel = Required
Server = @LSCK0_SERVER@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
