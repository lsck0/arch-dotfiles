# home_wired (a desktop by default): ethernet is only ever home, so it keeps the hardware mac and its dhcp reservation
[connection-home-wired]
match-device=type:ethernet
ethernet.cloned-mac-address=permanent
# arm wake-on-lan (magic packet to the permanent mac) so the homelab can wake it over the wireguard tunnel; needs
# "Wake on LAN"/"Power On by PCIe" enabled in firmware and ErP/deep-off left off. NM reads this default as a number
# only: "magic" here parses to nothing and leaves wol unmanaged, so 64 is magic's flag (0x40)
ethernet.wake-on-lan=64
