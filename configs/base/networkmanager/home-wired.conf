# desktop only: it is only ever wired at home, so ethernet keeps the hardware mac and its dhcp reservation
[connection-home-wired]
match-device=type:ethernet
ethernet.cloned-mac-address=permanent
# arm wake-on-lan (magic packet to the permanent mac) so the homelab can wake it over the wireguard tunnel; needs
# "Wake on LAN"/"Power On by PCIe" enabled in firmware and ErP/deep-off left off
ethernet.wake-on-lan=magic
