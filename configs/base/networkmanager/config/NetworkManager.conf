[main]
dns=systemd-resolved
rc-manager=symlink

[device]
wifi.scan-rand-mac-address=yes

[connection]
# one MAC per network and boot, never the hardware one: a new one per activation made every resume a new device to
# a captive portal. The same id seeds the IPv6 stable-privacy address
connection.stable-id=${CONNECTION}/${BOOT}
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.dhcp-duid=ll
ipv6.addr-gen-mode=stable-privacy
ipv6.ip6-privacy=2

[connectivity]
# arch's own probe, spelled out: 80-homelab-routes reads the host from here for a home link's split dns
uri=http://ping.archlinux.org/nm-check.txt
interval=600
