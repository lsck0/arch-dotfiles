[main]
dns=systemd-resolved
rc-manager=symlink

[device]
wifi.scan-rand-mac-address=yes

[connection]
# home profiles keep the hardware mac (home-wired.conf, mod.nu)
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# duid from the random mac, not the machine-id
ipv6.dhcp-duid=ll
ipv6.addr-gen-mode=stable-privacy
ipv6.ip6-privacy=2

# not arch's default uri, which announces arch on every network
[connectivity]
uri=http://connectivitycheck.gstatic.com/generate_204
response=
