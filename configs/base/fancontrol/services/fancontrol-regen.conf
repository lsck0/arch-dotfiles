[Unit]
Requires=fancontrol-gen.service
After=fancontrol-gen.service
StartLimitIntervalSec=1min
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5s
# a resume or hwmon reload can briefly make pwm busy: restart quietly; direct skips the failed state, so
# system-notify (base/failure-notify, is-failed) reports it only once the start limit leaves it failed
RestartMode=direct
