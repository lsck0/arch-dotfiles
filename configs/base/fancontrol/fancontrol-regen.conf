[Unit]
# fancontrol keeps ProtectSystem=full, so an unsandboxed oneshot writes its config
Requires=fancontrol-gen.service
After=fancontrol-gen.service
# five tries cover the resume window, a broken it87 still ends in failed
StartLimitIntervalSec=1min
StartLimitBurst=5

[Service]
# it87 answers EBUSY for a moment after an s3 resume, and fancontrol then aborts with every fan at full speed
Restart=on-failure
RestartSec=5s
