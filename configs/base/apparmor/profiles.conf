# openers are enforced too: a confined exec into a complain profile would be an unconfined way out

firefox enforce
firefox-crashhelper enforce
firefox-crashreporter enforce
firefox-gfxtest enforce
firefox-glxtest enforce
firefox-minidump-analyzer enforce
firefox-pingsender enforce
firefox-plugin-container enforce
firefox-vaapitest enforce
chromium enforce
qutebrowser enforce
lynx enforce
cha enforce
# the browsers' px target for pass autofill; unloaded, the exec fails
browserpass enforce

thunderbird enforce
thunderbird-glxtest enforce
thunderbird-vaapitest enforce
discord enforce
discord-chrome-sandbox enforce
signal-desktop enforce
signal-desktop-chrome-sandbox enforce
# qt's shader cache links an O_TMPFILE into place, a deleted path only mediate_deleted lets rules see
telegram-desktop enforce,mediate_deleted
element-desktop enforce
hexchat enforce
zapzap enforce

spotify enforce
# mpv-stream's ip netns exec leaves the inherited tty a disconnected path
mpv enforce,attach_disconnected

zathura enforce
sioyek enforce
okular enforce
bookokrat enforce
libreoffice enforce
onlyoffice enforce
feh enforce
nsxiv enforce
imv enforce

obsidian enforce
zotero enforce

# own profile: apparmor.d's localsend attaches to /bin/localsend, arch runs /usr/lib/localsend/localsend_app
localsend-app enforce

# rce-capable mcp servers; the blender add-on's rce is in-process, only the relay is confined
blender-mcp enforce
obs-mcp enforce

qbittorrent enforce
ouch enforce
7z enforce
unrar enforce
unzip enforce
magick enforce
pdftoppm enforce
ffmpegthumbnailer enforce
# yt-dlp runs ffmpeg through ip netns exec, a disconnected tty as for mpv
ffmpeg enforce,attach_disconnected
ffprobe enforce,attach_disconnected
handbrake enforce

child-open enforce
child-open-any enforce
child-open-browsers enforce
child-open-strict enforce
child-modprobe-nvidia enforce
