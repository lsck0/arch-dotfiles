# every profile the module deploys and its mode: apparmor.d's (aa-install installs the first column through
# include.d, for the programs present) and this module's own in profiles/ (where apparmor.d has none). flags.d's
# "<mode>,<flag>" adds profile flags to apparmor.d's, the module's own keep theirs in their header.
# enforce: everything that opens other people's content. `aa complain <profile>` backs one off on a machine,
# apparmor.test.nu keeps this list in enforce.
# a confined program may only exec into a loaded profile, and one in complain would be an unconfined way out: the
# openers below are enforced too, and targets that would confine a general tool everywhere (dolphin for "show in
# folder") stay unloaded, so that exec fails instead; gpg for thunderbird and libreoffice and yt-dlp for mpv run in
# a child of their own (local/). child-open-any, the browsers' opener, still starts any installed program
# unconfined: local/ denies it the shells, interpreters and launchers that would run what a browser wrote, a terminal
# it opens still could

# browsers; teams in chromium or firefox keeps camera, mic and screen sharing (pipewire, portal) through apparmor.d's
# browser abstractions
firefox enforce
firefox-crashhelper enforce
firefox-crashreporter enforce
firefox-gfxtest enforce
firefox-glxtest enforce
firefox-minidump-analyzer enforce
firefox-pingsender enforce
firefox-plugin-container enforce
firefox-vaapitest enforce
chromium enforce
qutebrowser enforce
lynx enforce
cha enforce
# browserpass's native host, the px target chromium and firefox start for pass autofill; unloaded, the exec fails
browserpass enforce

# mail and chat
thunderbird enforce
thunderbird-glxtest enforce
thunderbird-vaapitest enforce
discord enforce
discord-chrome-sandbox enforce
signal-desktop enforce
signal-desktop-chrome-sandbox enforce
# qt's shader cache links an O_TMPFILE into place, a deleted entry only mediate_deleted lets the rules see
telegram-desktop enforce,mediate_deleted
element-desktop enforce
hexchat enforce
zapzap enforce

# media
spotify enforce
# mpv-stream (protonvpn-netns) starts it through ip netns exec, whose new mount namespace leaves the terminal it
# inherits a disconnected path, refused even to its own tty without attach_disconnected
mpv enforce,attach_disconnected

# documents and images
zathura enforce
sioyek enforce
okular enforce
bookokrat enforce
libreoffice enforce
onlyoffice enforce
feh enforce
nsxiv enforce
imv enforce

# notes and references: electron and gecko apps that open other people's vaults, pdfs and web snapshots
obsidian enforce
zotero enforce

# file transfer from the phone and other devices over the home lan. apparmor.d's own localsend profile attaches to
# /bin/localsend, but arch runs the resolved /usr/lib/localsend/localsend_app (so that one stays unconfined, like its
# firefox and element stubs); this is the module's own profile keyed to the real binary
localsend-app enforce

# agent-driven mcp servers: rce-capable, pinned by their wiring (configs/creating/*). the blender relay reaches a
# loopback bridge only a blender started with blender-mcp-bridge opens; the profile confines the relay process on disk,
# the add-on's rce is in-process. obs-mcp drives obs over its loopback websocket
blender-mcp enforce
obs-mcp enforce

# torrents, and the archive and image tools file managers and yazi's previews run on downloaded files
qbittorrent enforce
ouch enforce
7z enforce
unrar enforce
unzip enforce
magick enforce
pdftoppm enforce
ffmpegthumbnailer enforce
# the transcoders run by hand on downloaded media and discs. yt-dlp runs ffmpeg in the protonvpn namespace (ip netns
# exec), whose new mount namespace leaves the inherited terminal a disconnected path, as for mpv
ffmpeg enforce,attach_disconnected
ffprobe enforce,attach_disconnected
handbrake enforce

# the openers every profile above hands links and files to, and their nvidia helper
child-open enforce
child-open-any enforce
child-open-browsers enforce
child-open-strict enforce
child-modprobe-nvidia enforce
