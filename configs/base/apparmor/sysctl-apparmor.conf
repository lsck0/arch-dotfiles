# no auditd: kauditd hands every apparmor record to printk under printk_ratelimit, 10 per 5s, and drops the rest
# silently ("kauditd_printk_skb: N callbacks suppressed", the audit lost counter stays 0). the boot's profile loads
# and one app's start can each pass 200; a burst of 1000 keeps them, the 5s window still caps a flood
kernel.printk_ratelimit_burst = 1000
