add_newline = true
command_timeout = 3000
scan_timeout = 500

format = """
$directory${custom.worktree}$git_branch$git_status$rust$python$nodejs$golang$lua$nix_shell$cmd_duration$jobs$status
$character"""

[character]
success_symbol = '[λ](bold green)'
error_symbol = '[λ](bold red)'

[directory]
style = 'bold blue'
read_only = ' '
read_only_style = 'bold red'
truncation_symbol = '.../'
format = '[\[](bold blue)[$path]($style)[$read_only]($read_only_style)[\]](bold blue) '

[git_branch]
symbol = ' '
style = 'bold blue'
format = '[$symbol$branch]($style) '

# linked worktree as repo/worktree since directory truncates to the worktree root, bare repo root as repo/bare
[custom.worktree]
when = true
require_repo = true
shell = ['sh']
command = '''git rev-parse --path-format=absolute --git-dir --git-common-dir --is-bare-repository 2>/dev/null | {
read -r dir; read -r common; read -r bare
repo=${common%/}; repo=${repo%/.git}; repo=${repo%/.bare}; repo=${repo##*/}
if [ "$bare" = true ]; then echo "$repo/bare"; elif [ "$dir" != "$common" ]; then echo "$repo/${dir##*/}"; fi
}'''
style = 'bold purple'
format = '([󰙅 $output]($style) )'

[nix_shell]
symbol = "󰜗 "

[git_status]
disabled = false
style = 'bold red'
# presence only, counts would spam on dirty repos
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '='
untracked = '?'
stashed = '\$'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[cmd_duration]
min_time = 500
style = 'bold yellow'
format = '[${duration}]($style) '

[status]
disabled = false
style = 'bold red'
symbol = '[x](bold red) '
format = '[$symbol$status]($style) '

[jobs]
symbol = '&'
style = 'bold blue'
format = '[$symbol$number]($style) '

[rust]
symbol = ' '
style = 'bold red'
format = '[$symbol($version)]($style) '

[python]
symbol = ' '
style = 'bold yellow'
format = '[$symbol($version)]($style) '

[nodejs]
symbol = ' '
style = 'bold green'
format = '[$symbol($version)]($style) '

[golang]
symbol = ' '
style = 'bold cyan'
format = '[$symbol($version)]($style) '

[lua]
symbol = ' '
style = 'bold blue'
format = '[$symbol($version)]($style) '
