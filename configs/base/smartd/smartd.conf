# /etc/smartd.conf (configs/base/smartd): every disk smartctl finds, with health, attributes and the error and
# self-test logs (-a, which also catches an nvme's own overheating warning), offline collection and attribute autosave
# on ata disks, a sleeping disk left asleep, a short self-test nightly and a long one on saturdays. what fails is
# logged at crit, which system-notify (configs/base/failure-notify) shows; no mail
DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03)
