# endlessh decoy on 22, real sshd port-knocked open
Port 2222

AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowGroups wheel
MaxAuthTries 3
LoginGraceTime 30

# -L stays: a shell could reach the same anyway
AllowAgentForwarding no
X11Forwarding no
AllowTcpForwarding local
AllowStreamLocalForwarding no
PermitTunnel no
