# endlessh decoy on 22, real sshd port-knocked open
Port 2222

# keys only, admins only, never root: a keyless or non-admin user has no remote ssh surface
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowGroups wheel
MaxAuthTries 3
LoginGraceTime 30

# no agent or X11 back into a client, no listener opened here (-R); -L stays, a shell could reach the same anyway
AllowAgentForwarding no
X11Forwarding no
AllowTcpForwarding local
AllowStreamLocalForwarding no
PermitTunnel no
