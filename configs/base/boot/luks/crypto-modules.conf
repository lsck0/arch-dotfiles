# sd-encrypt adds every module under /crypto/ without this, hardware drivers included (qat_6xxx, whose firmware
# linux-firmware does not ship, warns on every build). bootstrap's LUKS_FORMAT, aes-xts-plain64 with sha256, is
# built into linux and linux-lts; aesni is its fast path, the algif modules libcryptsetup's keyslot decryption.
CRYPTO_MODULES="aesni_intel? algif_skcipher? algif_hash?"
