# /boot/loader/loader.conf (configs/base/boot/systemd-boot). no entry files: each kernel's signed uki in /EFI/Linux is
# found by itself, linux-lts the fallback below linux; a Windows Boot Manager on the same esp shows up as auto-windows
# the menu for 1 s, any key stops the countdown
timeout 1
default arch-linux.efi
# the uki's cmdline is signed with it, and under secure boot systemd-stub ignores one passed in anyway
editor no
# the firmware's own mode: no switch between its logo, the menu and plymouth
console-mode keep
