[Service]
# distinct from the running-system sshd (port 2222): a separate known_hosts entry, no confusion about which answered
Environment=SSHD_PORT=2223

[X-SystemdTool]
# read by the systemd-tool install hook (drop-ins are concatenated): pull these into the initramfs image
InitrdPath=/root/.ssh/authorized_keys
InitrdPath=/root/.profile
