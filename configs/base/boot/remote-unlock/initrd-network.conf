# Stopped and done before switch-root: unordered, its ExecStop (every link down) can still run when switch-root
# kills the initrd's processes, and the unit enters the real system as failed (SIGTERM)
[Unit]
Conflicts=initrd-switch-root.target
Before=initrd-switch-root.target

[X-SystemdTool]
InitrdPath=/usr/lib/udev/rules.d/75-net-description.rules
InitrdPath=/usr/lib/udev/rules.d/80-net-setup-link.rules
InitrdPath=/usr/lib/systemd/network/99-default.link
