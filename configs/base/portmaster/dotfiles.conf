[Service]
# portmaster answers port 53 unsigned: DNSSEC and DoT off, or resolved fails lookups after boot
ExecStopPost=
ExecStopPost=-/usr/lib/portmaster/portmaster-core recover-iptables
ExecStartPost=-/bin/sh -c 'mkdir -p /run/systemd/resolved.conf.d && printf "[Resolve]\\nDNSOverTLS=no\\nDNSSEC=no\\n" >/run/systemd/resolved.conf.d/portmaster.conf && systemctl --no-block try-reload-or-restart systemd-resolved.service'
ExecStopPost=-/bin/sh -c 'rm -f /run/systemd/resolved.conf.d/portmaster.conf && { [ "$$(systemctl is-system-running)" = stopping ] || systemctl --no-block try-reload-or-restart systemd-resolved.service; }'
PIDFile=
