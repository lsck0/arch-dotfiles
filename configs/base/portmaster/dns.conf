[Service]
# while it runs, resolved's own dot to quad9 is a dns bypass portmaster refuses, and nss-resolve (most lookups) then
# fails: resolved goes plain, its port 53 is what portmaster intercepts, filters and sends on over its own dot. once it
# stops (protonvpn, the firewall toggle) resolved is back on dot. /run sorts after /etc's dotfiles.conf by name
ExecStartPost=-/bin/sh -c 'mkdir -p /run/systemd/resolved.conf.d && printf "[Resolve]\\nDNSOverTLS=no\\n" >/run/systemd/resolved.conf.d/portmaster.conf && systemctl --no-block try-reload-or-restart systemd-resolved.service'
ExecStopPost=-/bin/sh -c 'rm -f /run/systemd/resolved.conf.d/portmaster.conf && systemctl --no-block try-reload-or-restart systemd-resolved.service'
# 2.x never writes the packaged unit's pid file; with a start-post systemd waits for it and times the start out
PIDFile=
