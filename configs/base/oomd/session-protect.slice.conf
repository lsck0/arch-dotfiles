[Slice]
# the compositor, quickshell (lock screen included), pipewire, portals, polkit agent and hypridle: their working set
# survives a build's reclaim, and under eevdf they outweigh app.slice 4:1 (scx_lavd ignores cpu.weight, see base/scx).
# not monitored by oomd, which only kills in app.slice, so ManagedOOMPreference has nothing to steer here
MemoryLow=2G
CPUWeight=400
