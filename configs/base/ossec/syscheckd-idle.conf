# no restart on change: a restart is a new full pre-scan; it takes effect at the next boot
# syscheckd hashes the whole tree in a pre-scan after every start (25 min on the notebook): it gets only the cpu
# nothing else wants. The nvme's "none" scheduler ignores io priority, so the IO lines matter on sata only.
# Never on battery (144 s of cpu, 25 min of io on the notebook): 99-ossec-ac.rules starts it once mains comes online
[Unit]
ConditionACPower=true

[Service]
Nice=19
CPUSchedulingPolicy=idle
CPUWeight=idle
IOSchedulingClass=idle
IOWeight=1
