# read-only alert log access for the ossec-alerts group; the package ships /var/lib/ossec-hids root-only (700)
a+ /var/lib/ossec-hids                   - - - - group:ossec-alerts:--x
a+ /var/lib/ossec-hids/logs              - - - - group:ossec-alerts:--x
# the default entry carries over to the alerts.log monitord recreates at each midnight rotation
a+ /var/lib/ossec-hids/logs/alerts       - - - - group:ossec-alerts:r-x,default:group:ossec-alerts:r--
a+ /var/lib/ossec-hids/logs/alerts/alerts.log - - - - group:ossec-alerts:r--
