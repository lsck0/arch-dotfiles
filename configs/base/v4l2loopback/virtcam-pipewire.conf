# the obs virtual camera as a pipewire camera, for apps on the camera portal (firefox with
# media.webrtc.camera.allow-pipewire, chromium's WebRTCPipeWireCamera, flatpaks). exclusive_caps=1 announces CAPTURE
# only while obs writes, and wireplumber probes the loopback once at login, while obs is off: its udev device never
# gets a node. this node is made once and probes on use, so it serves frames whenever obs runs; with obs off it has
# no formats and a stream on it fails to start. chromium and electron keep the direct v4l2 path, which exclusive_caps=1
# exists for: they skip a node that also announces OUTPUT
context.objects = [
    {
        factory = spa-node-factory
        args = {
            factory.name = api.v4l2.source
            node.name = v4l2_input.obs-virtual-camera
            node.description = "OBS Virtual Camera"
            node.nick = "OBS Virtual Camera"
            media.class = Video/Source
            media.role = Camera
            device.api = v4l2
            api.v4l2.path = /dev/video@VIDEO_NR@
            node.pause-on-idle = false
            # below a real camera's 1000, so the webcam stays the default
            priority.session = 900
        }
        # no loopback module (a fresh install before reboot): pipewire still starts
        flags = [ nofail ]
    }
]
