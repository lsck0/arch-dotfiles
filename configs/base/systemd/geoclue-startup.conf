# geoclue deadlocks at startup before it claims its bus name, so activations hit the 90 s start timeout. The network
# monitor's can_reach threads build the libproxy resolver under GIO's module lock, and libproxy's sysconfig plugin
# then waits on the vfs singleton, which the main thread is creating while it waits for that same lock. The dummy
# resolver never loads libproxy (the system has no proxy); the local vfs keeps GVfs from looking for a session bus.
[Service]
Environment=GIO_USE_PROXY_RESOLVER=dummy
Environment=GIO_USE_VFS=local
