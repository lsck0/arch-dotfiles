# managed by arch-dotfiles/systemd
# thinkpad's EC reports the level systemd-backlight restored but stays dark until a real change: write it again over 0
[Service]
ExecStartPost=/bin/sh -c 'case "$1" in leds:*kbd_backlight) f="/sys/class/leds/$${1#leds:}/brightness"; read -r level <"$f"; echo 0 >"$f"; echo "$level" >"$f";; esac' _ %I
