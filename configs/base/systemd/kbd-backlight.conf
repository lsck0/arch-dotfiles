# managed by arch-dotfiles/systemd
# a keyboard backlight comes up fully lit on every boot, whatever systemd-backlight saved at shutdown, so ly already has it.
# thinkpad's EC reports the restored level but stays dark until it sees a real change, so drop to 0 before max
[Service]
ExecStartPost=/bin/sh -c 'case "$1" in leds:*kbd_backlight) d="/sys/class/leds/$${1#leds:}"; echo 0 >"$d/brightness"; cat "$d/max_brightness" >"$d/brightness";; esac' _ %I
