# managed by arch-dotfiles/systemd
# thinkpad's EC stays dark on a restored level until a real change, so drop to 0 before max
[Service]
ExecStartPost=/bin/sh -c 'case "$1" in leds:*kbd_backlight) d="/sys/class/leds/$${1#leds:}"; echo 0 >"$d/brightness"; cat "$d/max_brightness" >"$d/brightness";; esac' _ %I
