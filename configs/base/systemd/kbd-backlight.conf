# managed by arch-dotfiles/systemd
# a keyboard backlight comes up fully lit on every boot, whatever systemd-backlight saved at shutdown, so ly already has it
[Service]
ExecStartPost=/bin/sh -c 'case "$1" in leds:*kbd_backlight) d="/sys/class/leds/$${1#leds:}"; cat "$d/max_brightness" >"$d/brightness";; esac' _ %I
