# managed by arch-dotfiles/systemd
[Login]
# a short press must not end the session: it suspends (an agent's block inhibitor holds that too), a long one powers off
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
# the lock before sleep (desktop/hyprland's before_sleep_cmd) has to be up before the suspend; the default is 5 s
InhibitDelayMaxSec=15
