# ranger config - cyberpunk terminal rice, tracks the pywal palette.

# Accent-forward colorscheme built on ANSI slots (follows pywal).
set colorscheme cyberpunk

# Nerd Font file icons (vendored ranger_devicons plugin linemode).
default_linemode devicons

# Kitty inline image previews (kept from the original config).
set preview_images true
set preview_images_method kitty

# Preview file contents in the third column.
set preview_files true
set preview_directories true
set use_preview_script false

# Framed, three-column Miller layout with a sensible split.
set draw_borders both
set column_ratios 1,3,4
set padding_right true

# Titlebar niceties.
set tilde_in_titlebar true
set dirname_in_tabs true
set update_title true

# Show line numbers relative to the hovered file.
set line_numbers relative
set one_indexed true

# Hidden files off by default; zh toggles them.
set show_hidden false

# Mouse support and unicode ellipsis for long names.
set mouse_enabled true
set unicode_ellipsis true

# Keep the existing trash keybinding.
map DD shell trash -v %s
