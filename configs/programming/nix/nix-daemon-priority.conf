[Service]
# builds yield to the desktop, every build child inherits it (nixos's daemonCPUSchedPolicy and daemonIOSchedClass);
# best-effort 7, not idle: a devenv shell waits on these builds, idle io would starve it behind a game load
Nice=15
CPUSchedulingPolicy=batch
IOSchedulingClass=best-effort
IOSchedulingPriority=7
CPUWeight=20
