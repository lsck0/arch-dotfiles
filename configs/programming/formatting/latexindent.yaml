defaultIndent: "    "
onlyOneBackUp: 1
maxNumberOfBackUps: 1
removeTrailingWhitespace:
    beforeProcessing: 1
    afterProcessing: 1
lookForAlignDelims:
    align: 0
    align*: 0
    alignat: 0
    alignat*: 0
    aligned: 0
    alignedat: 0
    flalign: 0
    flalign*: 0
    split: 0
modifyLineBreaks:
    preserveBlankLines: 1
    textWrapOptions:
        columns: 120
        when: after
        blocksFollow:
            other: '\\\]|\\item(?:\h|\[)|\\begin\{[^}]*\}(?:\[[^\]]*\])?(?:\\label\{[^}]*\})?|\\end\{[^}]*\}|\\\\(?:\[[^\]]*\])?'
        blocksEndBefore:
            other: '\\begin\{|\\\[|\\end\{'
        blocksBeginWith:
            A-Z: 0
            a-z: 0
            other: '(?!LTXIN-TK-)[A-Za-z](?![^\n]*?(?<!\\)&)'
