gui:
    nerdFontsVersion: "3"
    theme:
        activeBorderColor:
            - blue
            - bold
        inactiveBorderColor:
            - white
        selectedLineBgColor:
            - blue
        optionsTextColor:
            - blue
git:
    diffRenderers:
        - command: delta --no-gitconfig --dark --paging=never --line-numbers
          name: delta
        - command: delta --no-gitconfig --dark --paging=never --line-numbers --side-by-side
          name: delta side-by-side
os:
    editPreset: nvim
