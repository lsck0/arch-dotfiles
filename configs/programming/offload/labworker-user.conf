# labworker's manager and with it every lab job: no login's home, its own /tmp, read-only /usr, /boot and /etc. Nothing
# over /proc or /sys (ProtectKernel*, ProtectControlGroups) and no NoNewPrivileges: rootless podman mounts its own
# proc and sysfs, which the kernel refuses under overmounts, and maps its sub-ids through the setuid newuidmap.
[Service]
InaccessiblePaths=-/home -/root
PrivateTmp=yes
ProtectSystem=full
LockPersonality=yes
RestrictRealtime=yes
