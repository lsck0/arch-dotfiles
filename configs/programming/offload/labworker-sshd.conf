# offload: the lab's builder logs in as labworker with the one key in offload_authorized_keys, whose line forces the
# worker's entry; the rest of sshd's surface is shut for it here as well
AllowGroups labworker

Match User labworker
    AuthorizedKeysFile /etc/ssh/offload_authorized_keys
    AuthenticationMethods publickey
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 2
