# Configuration file for NetworkManager.
# See "man 5 NetworkManager.conf" for details.

[main]
# `dns=` picks NM's DNS aggregation plugin (default/dnsmasq/systemd-resolved
# /...) — it does NOT control who writes /etc/resolv.conf. That's
# `rc-manager`, whose default on this NM build is "symlink", which since
# /etc/resolv.conf is a regular file here means NM just writes it directly.
# That conflicts with openresolv/wg-quick's DNS hook: wg-quick calls
# `resolvconf` to push its own DNS entry, but openresolv refuses to touch a
# resolv.conf it doesn't recognize as its own (a "signature mismatch"),
# since NM wrote it directly rather than through resolvconf. rc-manager
# below is the actual fix; routing NM's writes through resolvconf too makes
# both tools agree on who owns the file.
rc-manager=resolvconf
