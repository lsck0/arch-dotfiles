# Dependencies aur recipes forget, added by the homelab builder before it builds them.
# <pkgbase> <depends|makedepends> <package>...; runtime libraries go in depends, or clients install without them.

mov-cli                           makedepends  python-setuptools
python-devgoldyutils              makedepends  python-installer
python-mov-cli-test               makedepends  python-setuptools
python-pytubefix                  makedepends  python-setuptools
python-pytubefix                  depends      python-aiohttp python-nodejs-wheel-binaries
# raddbg links libatomic, the recipe lists only the x11, gl and freetype libraries
raddebugger                       depends      libatomic
# semgrep imports the otlp http exporter at startup (telemetry.py); the recipe lists only the api and sdk
semgrep-bin                       depends      python-opentelemetry-exporter-otlp-proto-http
# upstream moved from sdl2 to RGFW on plain X11; the recipe still lists sdl2
sowon-git                         depends      libx11 libxrandr libglvnd
sowon-git                         makedepends  libxi libxcursor libxext
